                placeholder="e.g. JavaScript functions"
              />
              <div style={{ display: "flex", gap: 8, marginTop: 14, flexWrap: "wrap" }}>
                {["Beginner", "Intermediate", "Advanced"].map((l) => (
                  <button key={l} onClick={() => { setLevel(l); setLevelTouched(true); }} className={"ghost" + (level === l ? " on" : "")}>{l.toUpperCase()}</button>
                ))}
              </div>
              <button onClick={() => startQuick()} className="primary" style={{ marginTop: 18 }}>Start lesson</button>
              {err && <p style={{ marginTop: 10, fontSize: 13, color: "var(--margin)" }}>{err}</p>}
              <p className="kicker" style={{ marginTop: 18 }}>FROM THE LIBRARY · NO KEY NEEDED</p>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 8 }}>
                {CONTENT.quickPicks.map((q) => (
                  <button
                    key={q.label}
                    onClick={() => {
                      const pick = nextInCourse(q.course, { courseId: q.course, u: q.u, l: q.l });
                      const ls = contentLessonAt(pick.courseId, pick.u, pick.l);
                      if (ls) setPendingPick({ q, title: ls.title, steps: ls.steps.length });
                    }}
                    className={"chip" + (pendingPick && pendingPick.q.label === q.label ? "" : "")}
                    style={{ fontSize: 13, padding: "6px 10px", borderColor: pendingPick && pendingPick.q.label === q.label ? "var(--ink)" : undefined }}
                  >
                    {q.label}
                  </button>
                ))}
              </div>
              {pendingPick && (
                <div className="card" style={{ marginTop: 10, padding: "10px 12px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, boxShadow: "none" }}>
                  <div>
                    <p style={{ margin: 0, fontWeight: 700, fontSize: 14.5 }}>{pendingPick.title}</p>
                    <p className="mono" style={{ margin: "3px 0 0", fontSize: 10, color: "var(--pencil)", letterSpacing: ".08em" }}>
                      {pendingPick.steps} STEPS · ~{Math.max(2, Math.round(pendingPick.steps * 0.7))} MIN
                    </p>
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button className="primary" style={{ width: "auto", padding: "8px 14px", fontSize: 14 }}
                      onClick={() => { const q = pendingPick.q; setPendingPick(null); launchFromLibrary(q.course, q.u, q.l, q.topic || q.label); }}>
                      Start
                    </button>
                    <button className="ghost" onClick={() => setPendingPick(null)}>✕</button>
                  </div>
                </div>
              )}
              <p className="kicker" style={{ marginTop: 18 }}>WITH AI · ANYTHING ELSE{aiKey().trim() ? "" : " (ADD A KEY IN STUDIO)"}</p>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 8 }}>
                {TRY_TOPICS.map((t) => (
                  <button
                    key={t}
                    onClick={() => { setTopic(t); startQuick(t); }}
                    className="chip"
                    style={{ fontSize: 13, padding: "6px 10px", borderStyle: "dashed" }}
                  >
                    {t}
                  </button>
                ))}
              </div>
              <p style={{ fontSize: 12.5, color: "var(--pencil)", lineHeight: 1.5, marginTop: 10 }}>
                Type anything above. Library subjects work offline; the AI covers the rest. For a full multi-lesson course, use Studio.
              </p>
            </div>

            {topSkills.length > 0 && (
              <div style={{ marginTop: 34 }}>
                <p className="kicker">MASTERY</p>
                <div style={{ marginTop: 8 }}>
                  {topSkills.map(([k, sk]) => (
                    <div key={k} role="button" tabIndex={0} style={{ padding: "8px 0", borderBottom: "1px dashed var(--box)", cursor: "pointer" }}
                      onClick={() => { setMasteryKey(k); setScreen("mastery"); }}
                      onKeyDown={(e) => { if (e.key === "Enter") { setMasteryKey(k); setScreen("mastery"); } }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                        <span style={{ fontSize: 14, fontWeight: 600 }}>{sk.label}</span>
                        <span className="mono" style={{ fontSize: 11, color: "var(--pencil)" }}>
                          {Math.round(sk.ema * 100)}%{recLevel(sk) ? " · " + recLevel(sk).toUpperCase() : ""} ›
                        </span>
                      </div>
                      <div className="bar" style={{ marginTop: 6 }}>
                        <i style={{ width: Math.round(sk.ema * 100) + "%", background: sk.ema >= 0.55 ? "var(--pen)" : "var(--margin)" }} />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div style={{ marginTop: 34 }}>
              <p className="kicker">MY COURSES</p>
              {library.courses.length > 3 && (
                <input
                  value={librarySearch}
                  onChange={(e) => setLibrarySearch(e.target.value)}
                  placeholder="Search courses and lessons…"
                  style={{ width: "100%", marginTop: 8, background: "var(--paper-2)", border: "1.5px solid var(--box)", borderRadius: 6, padding: "9px 12px", fontSize: 14 }}
                />
              )}
              {library.courses.length > 3 && (
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8 }}>
                  {["all", ...Array.from(new Set(library.courses.map((c) => c.subject)))].map((f) => (
                    <button key={f} className={"ghost" + (courseFilter === f ? " on" : "")} style={{ fontSize: 10, padding: "4px 8px" }} onClick={() => setCourseFilter(f)}>
                      {f === "all" ? "ALL" : f.toUpperCase()}
                    </button>
                  ))}
                </div>
              )}
              {library.courses.length === 0 && (
                <p style={{ marginTop: 10, fontSize: 14, color: "var(--pencil)", lineHeight: 1.55 }}>
                  No courses yet. Open Studio to draft one.
                </p>
              )}
              <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 10 }}>
                {(courseFilter === "all" ? library.courses : library.courses.filter((c) => c.subject === courseFilter))
                  .filter((c) => {
                    const q = librarySearch.trim().toLowerCase();
                    if (!q) return true;
                    if (c.title.toLowerCase().includes(q) || c.subject.toLowerCase().includes(q)) return true;
                    return c.units.some((u) => u.lessons.some((l) => l.title.toLowerCase().includes(q)));
                  })
                  .map((c) => {
                  const p = lessonProgressOf(c);
                  return (
                    <button
                      key={c.id}
                      className="card"
                      onClick={() => { setActiveCourseId(c.id); setCoursePick(null); setScreen("course"); }}
                      style={{ padding: 14 }}

                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <span style={{ fontWeight: 800, fontSize: 16 }}>{c.title}</span>
                        <span className="mono" style={{ fontSize: 11, color: "var(--pencil)" }}>{p.done}/{p.total} COMPLETED</span>
                      </div>
                      <p className="mono" style={{ fontSize: 11, color: "var(--pencil)", margin: "4px 0 0" }}>
                        {c.level.toUpperCase()}{p.ready < p.total ? " · " + p.ready + "/" + p.total + " GENERATED" : ""}
                      </p>
                      <div className="bar" style={{ marginTop: 10 }}>
                        <i style={{ width: (p.total ? (p.done / p.total) * 100 : 0) + "%" }} />
                      </div>

                  );
                })}
              </div>
            </div>

            {learner.history && learner.history.length > 0 && (

        {tab === "learn" && screen === "mastery" && masteryKey && skills[masteryKey] && (() => {

          return (

              <button className="mono" onClick={() => setScreen("home")} style={{ background: "none", border: "none", padding: 0, marginTop: 24, color: "var(--pencil)", fontSize: 12 }}>← BACK</button>

                              {l.steps.filter((st) => ["mcq", "numeric", "order", "output", "code", "build"].includes(st.type)).length > 0

        {screen === "lesson" && step && (

                    <span style={{ fontWeight: 900, fontSize: 24 }} className="hi">{fmt(exploreVal())}</span>

                </div>
                <button onClick={advance} className="primary" style={{ marginTop: 26 }}>Continue</button>

                </div>

                    if (resolved && i === step.answer) { border = "var(--pen)"; bg = "var(--good)"; }
                    else if (resolved && sel === i) { border = "var(--margin)"; bg = "var(--bad)"; }
                    else if (resolved) color = "var(--pencil)";
                    return (
                      <button key={i} className={"opt" + (dead && !checked ? " elim" : "")} disabled={dead && !checked} onClick={() => { if (!checked && !dead) setSel(i); }} style={{ borderColor: border, background: bg, color }}>
                        <span className="mono" style={{ fontSize: 11, color: "var(--pencil)", marginRight: 8 }}>{i + 1}</span>{o}
                      </button>

                </div>

                />
              </div>

                <input
                  value={num}
                  onChange={(e) => setNum(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter" && num.trim() && !checked) check(); }}

                  placeholder="Exact output"
                  disabled={checked}
                  className="mono"
                  style={{
                    marginTop: 14, width: "100%", background: "var(--paper-2)", borderRadius: 6, fontSize: 16,

                />
                {revealN > 0 && step.solution && !checked && (
                  <div className="hintbox">
                    <p className="kicker" style={{ margin: "0 0 6px" }}>HINT · SOLUTION SO FAR</p>

                {testResults && (
                  <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>

                      <div key={i} className="mono" style={{ fontSize: 12, padding: "8px 10px", borderRadius: 6, background: "var(--paper-2)", border: `1.5px solid ${r.pass ? "var(--pen)" : "var(--margin)"}` }}>
                        <span style={{ color: r.pass ? "var(--pen)" : "var(--margin)", fontWeight: 600 }}>{r.pass ? "✓" : "✗"}</span>{" "}
                        {r.call} → {r.error ? r.error : JSON.stringify(r.got)}
                        {!r.pass && !r.error && <span style={{ color: "var(--pencil)" }}> (expected {JSON.stringify(r.expect)})</span>}
                      </div>
                    ))}
                  </div>
                )}
                {showSol && (
                  <div style={{ marginTop: 14 }}>
                    <p className="kicker" style={{ marginBottom: 6 }}>SOLUTION</p>
                    <CodeBlock code={step.solution} />

                {checked && (
                  <div style={{ marginTop: 14, padding: "12px 14px", borderRadius: 6, background: "var(--paper-2)", border: `1.5px solid ${correct ? "var(--pen)" : "var(--margin)"}` }}>

                    </p>
                    <p style={{ marginTop: 6, fontSize: 14, lineHeight: 1.55 }}>{step.explain}</p>
                    {!correct && aiKey().trim() && (
                      <button className="ghost" style={{ marginTop: 10 }} onClick={askTutor} disabled={tutorBusy}>
                        {tutorBusy ? "TUTOR THINKING…" : "WHY DID I MISS THIS?"}

                        <button onClick={giveHint} className="ghost" style={{ flex: 1, padding: "10px 12px" }}>{hintLabel()} (−5 XP)</button>

                      {attempts >= 2 && (
                        <button onClick={giveUp} className="ghost" style={{ flex: 1, padding: "10px 12px" }}>SHOW SOLUTION</button>
                      )}
                    </div>
                  </div>
                ) : (
                  <button onClick={advance} className="primary" style={{ marginTop: 18 }}>{idx + 1 >= lesson.steps.length ? "Finish" : "Continue"}</button>
                )}
              </div>
            )}

            {sharedControls && (
              <div>
                {hintText && !checked && <div className="hintbox">{hintText}</div>}

                  <div>
                    <div style={{ marginTop: 16, padding: "14px 16px", borderRadius: 6, background: "var(--paper-2)", border: "1.5px solid var(--margin)" }}>

                      <p style={{ margin: "6px 0 0", fontSize: 14, lineHeight: 1.5 }}>

                    <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                      <button onClick={retryStep} className="primary" style={{ flex: 1 }}>Try again</button>

                  <div style={{ marginTop: 16, padding: "14px 16px", borderRadius: 6, background: "var(--paper-2)", border: `1.5px solid ${correct ? "var(--pen)" : "var(--margin)"}` }}>
                    <p className="mono" style={{ fontSize: 13, fontWeight: 600, color: correct ? "var(--pen)" : "var(--margin)" }}>
                      {correct ? "✓ CORRECT" : "✗ NOT THIS TIME"}
                      {correct && <span className="hi" style={{ marginLeft: 8, padding: "1px 6px" }}>+{lastGain} XP</span>}
                    </p>
                    {!correct && step.type === "numeric" && <p style={{ marginTop: 6, fontSize: 14, fontWeight: 600 }}>Answer: {step.answer}</p>}
                    {!correct && step.type === "output" && <p className="mono" style={{ marginTop: 6, fontWeight: 600, fontSize: 13 }}>Output: {String(step.expect)}</p>}
                    {!correct && step.type === "order" && (

                            {busyCourse || genQueue.length > 0 ? (
                              <button onClick={cancelGeneration} className="ghost" style={{ fontSize: 14, padding: "10px 12px", flex: 1, color: "var(--margin)", borderColor: "var(--margin)" }}>
                                Cancel · {genQueue.filter((k) => k.startsWith(c.id + ":")).length + (busyCourse ? 1 : 0)} left
                              </button>
                            ) : (
                              <button onClick={() => generateAll(c.id)} disabled={!!genState || genQueue.length > 0} className="primary" style={{ fontSize: 14, padding: "10px 12px", flex: 1 }}>
                                {Object.keys(genErrors).some((k) => k.startsWith(c.id + ":")) ? "Retry failed" : "Generate all"}
                              </button>
                            )}
                            <button
                              onClick={() => {
                                if (confirmDel === c.id) {
                                  const next = deep(libRef.current);
                                  next.courses = next.courses.filter((x) => x.id !== c.id);
                                  if (CONTENT.courses.some((cc) => cc.id === c.id)) {
                                    next.hiddenBuiltins = [...(next.hiddenBuiltins || []), c.id];
                                  }
                                  persistLib(next);
                                  setConfirmDel(null);
                                } else setConfirmDel(c.id);
                              }}
                              className="ghost"
                              style={{ color: "var(--margin)", borderColor: "var(--margin)", padding: "10px 12px" }}
                            >
                              {confirmDel === c.id ? "SURE?" : "DELETE"}
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Prexis />);
</script>
</body>
</html>
