const lessonSchema = `Allowed step types:
concept: {"type":"concept","heading":"3 to 6 words","body":"2 or 3 short plain sentences teaching one idea","code":"optional short JavaScript snippet"}
mcq: {"type":"mcq","prompt":"one clear question","options":["a","b","c","d"],"answer":0,"explain":"1 or 2 sentences on why","code":"optional snippet the question refers to"}
numeric: {"type":"numeric","prompt":"...","answer":12.5,"tolerance":0.5,"explain":"..."}
order: {"type":"order","prompt":"instruction to arrange the items","items":["first","second","third","fourth"],"explain":"...","codeItems":false} where items MUST already be listed in the correct order. Set codeItems to true only when the items are lines of code.
output: {"type":"output","code":"const a = [1, 2];\\nconsole.log(a.length);","prompt":"What does this print?","expect":"2","explain":"..."} where code is valid JavaScript that runs without errors and prints via console.log, and expect is the exact printed output.
code: {"type":"code","prompt":"one small clear coding task","starter":"function add(a, b) {\\n  \\n}","tests":[{"call":"add(2, 3)","expect":5},{"call":"add(0, 0)","expect":0}],"solution":"function add(a, b) {\\n  return a + b;\\n}","explain":"1 or 2 sentences"} where tests are expressions calling the learner's JavaScript, expect is the exact return value as JSON, and solution MUST pass every test.
explore: {"type":"explore","heading":"...","body":"tell the learner what to notice as they drag","expr":"1000*(1+r)^10","variable":"r","min":0,"max":0.2,"stepSize":0.005,"label":"rate","valueLabel":"balance"} where expr is a plain math expression using only numbers and the single variable, evaluable by mathjs.
Rules: 6 or 7 steps total. Step 1 is a concept. Include exactly 4 graded steps (mcq, numeric, order, output or code). If the topic is programming: use JavaScript only, include exactly one code step and at least one output step, and keep every snippet under 8 short lines. If the topic is not programming: do not use code, output or codeItems, and include one explore step only if the topic is quantitative. Every question must be solvable from the concept steps plus light reasoning. Difficulty rises gently. No trick questions. "answer" for mcq is a 0-based index. Voice: direct, specific, no cheerleading.`;

const parseJsonLoose = (text) => {
  if (text == null) throw new Error("empty model response");
  let clean = String(text).replace(/```json|```/g, "").trim();
  const start = clean.indexOf("{");
  const end = clean.lastIndexOf("}");
  if (start >= 0 && end > start) clean = clean.slice(start, end + 1);
  return JSON.parse(clean);
};

async function askGrok(prompt, { key, model, maxTokens } = {}) {
  if (!key) throw new Error("NO_KEY");
  const res = await fetch(XAI_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + key,
    },
    body: JSON.stringify({
      model: model || DEFAULT_MODEL,
      temperature: 0.2,
      max_tokens: maxTokens || 2200,
      messages: [
        {
          role: "system",
          content: "You are Grok Code building Prexis lessons. Reply with ONLY valid JSON. No markdown fences, no preamble, no trailing commentary.",
        },
        { role: "user", content: prompt },
      ],
    }),
  });
  const raw = await res.text();
  let data;
  try { data = JSON.parse(raw); } catch (e) { throw new Error("Bad response from xAI"); }
  if (!res.ok) {
    const msg = (data.error && (data.error.message || data.error)) || ("HTTP " + res.status);
    throw new Error(String(msg));
  }
  const text =
    (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) ||
    data.output_text ||
    "";
  return parseJsonLoose(text);
}

async function askClaude(prompt, { key, model, maxTokens } = {}) {
  if (!key) throw new Error("NO_KEY");
  const res = await fetch(ANTHROPIC_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: model || DEFAULT_CLAUDE_MODEL,
      // generous cap: on Opus/Sonnet 5, adaptive thinking tokens count toward max_tokens
      max_tokens: Math.max(maxTokens || 3000, 8192),
      system: "You are Claude building Prexis lessons. Reply with ONLY valid JSON. No markdown fences, no preamble, no trailing commentary.",
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const raw = await res.text();
  let data;
  try { data = JSON.parse(raw); } catch (e) { throw new Error("Bad response from Anthropic"); }
  if (!res.ok) {
    const msg = (data.error && (data.error.message || data.error)) || ("HTTP " + res.status);
    throw new Error(String(msg));
  }
  if (data.stop_reason === "refusal") throw new Error("Claude declined this request.");
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  return parseJsonLoose(text);
}

const deep = (x) => JSON.parse(JSON.stringify(x));
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const fmt = (n) => {
  if (n === null || n === undefined) return "…";
  const a = Math.abs(n);
  if (a >= 1000) return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  if (a >= 1) return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
  return Number(n.toPrecision(3)).toString();
};
const dayStr = (offset) => {
  const d = new Date();
  d.setDate(d.getDate() + (offset || 0));
  return d.toISOString().slice(0, 10);
};
const topicKey = (t) => String(t || "").trim().toLowerCase().slice(0, 40);

const storage = {
  async get(key) {
    try {
      if (window.storage && window.storage.get) return window.storage.get(key);
    } catch (e) {}
    try {
      const v = localStorage.getItem(key);
      return v ? { value: v } : null;
    } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      if (window.storage && window.storage.set) return window.storage.set(key, value);
    } catch (e) {}
    try { localStorage.setItem(key, value); } catch (e) {}
  },
};

const runJS = async (code) => {
  const logs = [];
  const fake = {
    log: (...a) => logs.push(a.map((x) => (typeof x === "object" ? JSON.stringify(x) : String(x))).join(" ")),
  };
  try {
    const fn = new Function("console", code);
    const ret = fn(fake);
    if (ret && typeof ret.then === "function") await ret;
    await Promise.resolve();
    await Promise.resolve();
    return { ok: true, logs, error: null };
  } catch (e) {
    return { ok: false, logs, error: String(e) };
  }
};

const runOneTest = async (userCode, t) => {
  try {
    const fn = new Function("console", userCode + "\n;return (" + t.call + ");");
    let got = fn({ log: () => {} });
    if (got && typeof got.then === "function") got = await got;
    const pass = JSON.stringify(got) === JSON.stringify(t.expect);
    return { call: t.call, expect: t.expect, got, pass, error: null };
  } catch (e) {
    return { call: t.call, expect: t.expect, got: undefined, pass: false, error: String(e) };
  }
};

const runTests = async (userCode, tests) => {
  const out = [];
  for (const t of tests || []) out.push(await runOneTest(userCode, t));
  return out;
};

async function verifyLesson(gen) {
  let flagged = 0;
  for (const s of gen.steps) {
    if (s.type === "code" && s.solution && Array.isArray(s.tests)) {
      const res = await runTests(s.solution, s.tests);
      s.verified = res.length > 0 && res.every((r) => r.pass);
      if (!s.verified) flagged += 1;
    }
    if (s.type === "output" && s.code) {
      const r = await runJS(s.code);
      const printed = r.logs.join("\n").trim();
      s.verified = r.ok && printed === String(s.expect).trim();
      if (!s.verified) flagged += 1;
    }
    if (s.type === "mcq" && (s.answer < 0 || s.answer >= (s.options || []).length)) {
      s.verified = false;
      flagged += 1;
    }
  }
  return flagged;
}

function ExploreGraph({ step, value }) {
  const W = 320, H = 150, P = 14;
  const data = useMemo(() => {
    const min = Number(step.min), max = Number(step.max);
    if (!isFinite(min) || !isFinite(max) || max <= min) return null;
    const pts = [];
    for (let i = 0; i <= 80; i++) {
      const x = min + ((max - min) * i) / 80;
      try {
        const y = math.evaluate(step.expr, { [step.variable]: x });
        if (typeof y === "number" && isFinite(y)) pts.push([x, y]);
      } catch (e) {}
    }
    if (pts.length < 2) return null;
    let lo = Infinity, hi = -Infinity;
    pts.forEach((p) => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); });
    if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
    return { pts, lo, hi, min, max };
  }, [step]);
  if (!data) return null;
  const sx = (x) => P + ((x - data.min) / (data.max - data.min)) * (W - 2 * P);
  const sy = (y) => H - P - ((y - data.lo) / (data.hi - data.lo)) * (H - 2 * P);
  const path = data.pts.map((p, i) => (i ? "L" : "M") + sx(p[0]).toFixed(1) + " " + sy(p[1]).toFixed(1)).join(" ");
  let marker = null;
  try {
    const y = math.evaluate(step.expr, { [step.variable]: Number(value) });
    if (typeof y === "number" && isFinite(y)) {
      marker = { x: sx(Math.max(data.min, Math.min(data.max, Number(value)))), y: sy(Math.max(data.lo, Math.min(data.hi, y))) };
    }
  } catch (e) {}
  return (
    <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", display: "block", marginTop: 12 }} aria-hidden="true">
      <line x1={P} y1={H - P} x2={W - P} y2={H - P} stroke="var(--box)" strokeWidth="1.5" />
      <line x1={P} y1={P} x2={P} y2={H - P} stroke="var(--box)" strokeWidth="1.5" />
      <text x={P + 3} y={H - 3} fill="var(--pencil)" fontSize="9" fontFamily="var(--mono)">{fmt(data.min)}</text>
      <text x={W - P} y={H - 3} fill="var(--pencil)" fontSize="9" textAnchor="end" fontFamily="var(--mono)">{fmt(data.max)}</text>
      <text x={P + 3} y={P + 1} fill="var(--pencil)" fontSize="9" fontFamily="var(--mono)">{fmt(data.hi)}</text>
      <path d={path} fill="none" stroke="var(--pen)" strokeWidth="2.5" strokeLinejoin="round" />
      {marker && <circle cx={marker.x} cy={marker.y} r="5.5" fill="var(--hi)" stroke="var(--ink)" strokeWidth="1.5" />}
    </svg>
  );
}

      key,
      topic: lessonTopic || "general",
      step: deep(s),
      due: dayStr(1),
      interval: 1,
      lapses: 0,
    };
    persistDeck([...deckRef.current, card].slice(-60));
  };
  const today = dayStr(0);
  const dueCards = deck.filter((c) => c.due <= today);

  const startReview = () => {
    const cards = dueCards.slice(0, 8);
    if (!cards.length) return;
    launchLesson(
      { title: "Smart review", steps: cards.map((c) => deep(c.step)) },
      { review: cards.map((c) => c.id) },
      ""
    );
  };

  useEffect(() => {
    if (screen !== "lesson" || !lesson) return;
    const s = lesson.steps[idx];
    if (s && s.type === "order" && Array.isArray(s.items)) {
      let pool = shuffle(s.items);
      if (pool.length > 1 && pool.join("|") === s.items.join("|")) pool.push(pool.shift());
      setOrderPool(pool);
      setOrderSeq([]);
    }
    if (s && s.type === "explore") setSliderVal((Number(s.min) + Number(s.max)) / 2);
    if (s && s.type === "code") {
      setCodeText(s.starter || "");
      setTestResults(null);
      setAttempts(0);
      setShowSol(false);
    }
    setHintN(0);
    setElim([]);
    setRevealN(0);
    setHintText("");
    setTutorNote("");
    setTutorBusy(false);
  }, [screen, lesson, idx]);

  useEffect(() => {
    const onKey = (e) => {
      if (screen !== "lesson" || !lesson) return;
      const s = lesson.steps[idx];
      if (!s) return;
      if (checked && e.key === "Enter") { e.preventDefault(); advance(); return; }
      if (checked) return;
      if (s.type === "mcq" && e.key >= "1" && e.key <= "4") {
        const i = Number(e.key) - 1;
        if (s.options[i] !== undefined && !elim.includes(i)) setSel(i);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const launchLesson = (parsed, source, topicStr) => {
    setLesson(parsed);
    setLessonSource(source);
    setLessonTopic(topicStr || "");
    setMarks(new Array(parsed.steps.length).fill(null));
    setIdx(0);
    setSel(null);
    setNum("");
    setChecked(false);
    setCorrect(false);
    setSXp(0);
    setSRight(0);
    setSTotal(0);
    setErr("");
    setScreen("lesson");
  };

  const aiKey = () => (provider === "claude" ? claudeKey : apiKey);
  const aiName = () => (provider === "claude" ? "Claude" : "Grok");
  const askAI = (prompt, extra) => {
    if (provider === "claude") return askClaude(prompt, { key: claudeKey.trim(), model: claudeModel, ...extra });
    return askGrok(prompt, { key: apiKey.trim(), model: modelId, ...extra });
  };

  const adaptContext = (topicLabel) => {
    const key = topicKey(topicLabel);
    const sk = skillsRef.current[key];
    const missed = deckRef.current
      .filter((c) => topicKey(c.topic) === key)
      .slice(-3)
      .map((c) => c.step.prompt || c.step.heading)
      .filter(Boolean);
    if (!sk && !missed.length) return "";
    let note = "";
    if (sk) note += `The learner's recent accuracy on this subject is ${Math.round(sk.ema * 100)}% over ${sk.n} sessions. Pitch difficulty accordingly. `;
    if (missed.length) note += `They recently got these wrong: ${missed.join(" / ")}. Reteach those ideas from a fresh angle before testing them again.`;
    return note.trim();
  };

  const startQuick = async (t) => {
    const chosen = (t || topic).trim();
    if (!chosen) return;
    const sk = skills[topicKey(chosen)];
    const lvl = levelTouched ? level : (recLevel(sk) || level);
    if (!levelTouched && recLevel(sk)) setLevel(recLevel(sk));
    setErr("");
    setScreen("loading");
    try {
      let parsed = null;
      const known = BUILT_IN.find((b) => b.topic.toLowerCase() === chosen.toLowerCase());
      if (known && !aiKey().trim()) parsed = deep(known.lesson);
      if (!parsed && aiKey().trim()) {
        const ctx = adaptContext(chosen);
        parsed = await askAI(
          `Create one short interactive lesson teaching: "${chosen}". Learner level: ${lvl}.
${ctx ? ctx + "\n" : ""}Respond with ONLY valid JSON. No markdown fences, no text before or after. Keep the whole response under 700 words.
Schema: {"title":"short punchy lesson title","steps":[...]}
${lessonSchema}`,
          { maxTokens: 2500 }
        );
      }
      if (!parsed) parsed = localLesson(chosen, lvl);
      if (!parsed || !Array.isArray(parsed.steps) || parsed.steps.length === 0) throw new Error("bad shape");
      launchLesson(parsed, null, chosen);
    } catch (e) {
      console.error(e);
      try {
        launchLesson(localLesson(chosen, lvl), null, chosen);
      } catch (e2) {
        setErr(e.message === "NO_KEY"
          ? "Add an API key in Studio, or pick a built-in topic."
          : aiName() + " couldn't build that. " + (e.message || "Try again."));
        setScreen("home");
      }
    }
  };

  const draftCourse = async () => {
    const s = subject.trim();
    if (!s || drafting) return;
    setStudioErr("");
    setDrafting(true);
    try {
      let outline;
      if (aiKey().trim()) {
        outline = await askAI(
          `Design a compact course teaching: "${s}". Learner level: ${sLevel}.
Respond with ONLY valid JSON, no fences, under 250 words.
{"title":"course title","units":[{"title":"unit title","lessons":["lesson title","lesson title","lesson title"]}]}
Exactly 2 units with exactly 3 lesson titles each, sequenced so difficulty builds. Titles under 6 words.`,
          { maxTokens: 800 }
        );
      } else {
        const c = localCourse(s, sLevel);
        outline = { title: c.title, units: c.units.map((u) => ({ title: u.title, lessons: u.lessons.map((l) => l.title) })) };
      }
      if (!outline || !Array.isArray(outline.units)) throw new Error("bad outline");
      const course = {
        id: Date.now().toString(36),
        subject: s,
        level: sLevel,
        title: outline.title || s,
        units: outline.units.map((u) => ({
          title: u.title,
          lessons: (u.lessons || []).map((lt) => ({ title: lt, status: "todo", steps: [], flagged: 0 })),
        })),
      };
      const next = deep(libRef.current);
      next.courses.unshift(course);
      await persistLib(next);
      setExpandedId(course.id);
      setSubject("");
    } catch (e) {
      console.error(e);
      setStudioErr(aiKey().trim() ? aiName() + " draft failed. " + (e.message || "Try again.") : "Course draft failed. Try again.");
    }
    setDrafting(false);
  };

  const generateOne = async (courseId, u, l) => {
    const course = libRef.current.courses.find((c) => c.id === courseId);
    if (!course) return false;
    const unit = course.units[u];
    const lessonTitle = unit.lessons[l].title;
    const prior = [];
    course.units.forEach((uu, ui) =>
      uu.lessons.forEach((ll, li) => {
        if (ui < u || (ui === u && li < l)) prior.push(ll.title);
      })
    );
    setGenState({ courseId, u, l, phase: "writing" });
    try {
      let gen;
      if (aiKey().trim()) {
        const ctx = adaptContext(course.subject);
        gen = await askAI(
          `Write one interactive lesson.
Course: "${course.title}", learner level ${course.level}. Unit: "${unit.title}". This lesson: "${lessonTitle}".
Earlier lessons already covered: ${prior.join("; ") || "none"}. Build on them, do not repeat them.
${ctx ? ctx + "\n" : ""}Respond with ONLY valid JSON. No markdown fences, no text before or after. Under 700 words.
Schema: {"title":"${lessonTitle}","steps":[...]}
${lessonSchema}`,
          { maxTokens: 2500 }
        );
      } else {
        gen = localLesson(`${lessonTitle} — ${course.title}`, course.level);
      }
      if (!gen || !Array.isArray(gen.steps) || gen.steps.length === 0) throw new Error("bad shape");
      gen.title = lessonTitle;

      setGenState({ courseId, u, l, phase: "checking" });
      let flagged = await verifyLesson(gen);

      const graded = gen.steps.map((s, i) => ({ s, i })).filter((x) => x.s.type === "mcq" || x.s.type === "numeric");
      if (aiKey().trim() && graded.length > 0) {
        try {
          const ver = await askAI(
            `Solve these questions independently and carefully. Respond with ONLY valid JSON, no fences:
{"answers":[{"i":0,"answer":2}]}
For multiple choice, "answer" is the 0-based index of the correct option. For numeric, "answer" is the number.
Questions:
${graded
  .map((x) =>
    x.s.type === "mcq"
      ? `[${x.i}] MCQ: ${x.s.code ? "Code: " + x.s.code + " " : ""}${x.s.prompt} Options: ${x.s.options.map((o, j) => j + ": " + o).join(" | ")}`
      : `[${x.i}] NUMERIC: ${x.s.prompt}`
  )
  .join("\n")}`,
            { maxTokens: 600 }
          );
          const byI = {};
          (ver.answers || []).forEach((a) => { byI[a.i] = a.answer; });
          graded.forEach((x) => {
            const va = byI[x.i];
            let ok = false;
            if (x.s.type === "mcq") ok = Number(va) === Number(x.s.answer);
            else {
              const tol = typeof x.s.tolerance === "number" ? x.s.tolerance : Math.max(0.01, Math.abs(x.s.answer) * 0.01);
              ok = typeof va === "number" && Math.abs(va - x.s.answer) <= tol;
            }
            x.s.verified = ok;
            if (!ok) flagged += 1;
          });
        } catch (e) {
          console.error("verify failed", e);
        }
      }

      const next = deep(libRef.current);
      const nc = next.courses.find((c) => c.id === courseId);
      nc.units[u].lessons[l] = { title: lessonTitle, status: "ready", steps: gen.steps, flagged };
      await persistLib(next);
      setGenState(null);
      return true;
    } catch (e) {
      console.error(e);
      setGenState(null);
      setStudioErr(aiName() + " failed to write that lesson. " + (e.message || "Tap GEN to retry."));
      return false;
    }
  };

  const generateAll = async (courseId) => {
    setStudioErr("");
    const course = libRef.current.courses.find((c) => c.id === courseId);
    if (!course) return;
    for (let u = 0; u < course.units.length; u++) {
      for (let l = 0; l < course.units[u].lessons.length; l++) {
        if (libRef.current.courses.find((c) => c.id === courseId).units[u].lessons[l].status !== "ready") {
          const ok = await generateOne(courseId, u, l);
          if (!ok) return;
        }
      }
    }
  };

  const startLibraryLesson = (courseId, u, l) => {
    const course = library.courses.find((c) => c.id === courseId);
    const ls = course.units[u].lessons[l];
    if (ls.status !== "ready") return;
    launchLesson({ title: ls.title, steps: ls.steps }, { courseId, u, l }, course.subject);
  };

  const step = lesson ? lesson.steps[idx] : null;
  const gradedTypes = ["mcq", "numeric", "order", "output", "code"];
  const isGraded = step && gradedTypes.includes(step.type);
  const sharedControls = step && ["mcq", "numeric", "order", "output"].includes(step.type);

  const setMark = (i, v) => setMarks((m) => { const nx = [...m]; nx[i] = v; return nx; });

  const stepGain = () => Math.max(5, 15 - 5 * hintN);

  const check = () => {
    let ok = false;
    if (step.type === "mcq") ok = sel === step.answer;
    if (step.type === "numeric") {
      const v = parseFloat(num);
      const tol = typeof step.tolerance === "number" ? step.tolerance : 0.01;
      ok = !isNaN(v) && Math.abs(v - step.answer) <= tol;
    }
    if (step.type === "order") ok = orderSeq.length === step.items.length && orderSeq.every((it, i) => it === step.items[i]);
    if (step.type === "output") ok = num.trim() === String(step.expect).trim();
    setCorrect(ok);
    setChecked(true);
    setMark(idx, ok ? "right" : "wrong");
    setSTotal((x) => x + 1);
    if (ok) {
      const g = stepGain();
      setLastGain(g);
      setSXp((x) => x + g);
      setSRight((x) => x + 1);
    } else {
      addToDeck(step);
    }
  };

  const runCode = async () => {
    const res = await runTests(codeText, step.tests);
    setTestResults(res);
    setAttempts((a) => a + 1);
    if (res.length > 0 && res.every((r) => r.pass)) {
      const g = stepGain();
      setLastGain(g);
      setCorrect(true);
      setChecked(true);
      setMark(idx, "right");
      setSTotal((x) => x + 1);
      setSRight((x) => x + 1);
      setSXp((x) => x + g);
    }
  };

  const giveUp = () => {
    setShowSol(true);
    setCorrect(false);
    setChecked(true);
    setMark(idx, "wrong");
    setSTotal((x) => x + 1);
    addToDeck(step);
  };

  /* ---- hint ladder ---- */
  const hintAvailable = () => {
    if (!step || checked) return false;
    if (step.type === "mcq") return elim.length < Math.max(0, (step.options || []).length - 2);
    if (step.type === "code") return step.solution && revealN < step.solution.split("\n").length - 1;
    if (step.type === "order") return orderSeq.length < step.items.length;
    if (step.type === "output" || step.type === "numeric") return hintN === 0;
    return false;
  };
  const giveHint = () => {
    if (!hintAvailable()) return;
    setHintN((h) => h + 1);
    if (step.type === "mcq") {
      const candidates = step.options
        .map((_, i) => i)
        .filter((i) => i !== step.answer && !elim.includes(i) && i !== sel);
      if (candidates.length) {
        const kill = candidates[Math.floor(Math.random() * candidates.length)];
        setElim((e) => [...e, kill]);
        if (sel === kill) setSel(null);
      }
    } else if (step.type === "code") {
      setRevealN((r) => r + 1);
    } else if (step.type === "order") {
      const next = step.items[orderSeq.length];
      setOrderSeq((s) => [...s, next]);
      setOrderPool((p) => {
        const i = p.indexOf(next);
        return i >= 0 ? p.filter((_, j) => j !== i) : p;
      });
    } else if (step.type === "output") {
      const e = String(step.expect).trim();
      setHintText(`The output starts with “${e[0] || ""}” and is ${e.length} character${e.length === 1 ? "" : "s"} long.`);
    } else if (step.type === "numeric") {
      const a = Number(step.answer);
      if (a === 0) setHintText("The answer is between -1 and 1.");
      else {
        const lo = a > 0 ? a * 0.5 : a * 1.5;
        const hi = a > 0 ? a * 1.5 : a * 0.5;
        setHintText(`The answer is between ${fmt(lo)} and ${fmt(hi)}.`);
      }
    }
  };

  const askTutor = async () => {
    if (tutorBusy) return;
    setTutorBusy(true);
    setTutorNote("");
    try {
      const given =
        step.type === "mcq" ? `They chose option ${sel}: "${step.options[sel]}". The correct option is ${step.answer}: "${step.options[step.answer]}".`
        : step.type === "numeric" ? `They answered ${num}. The correct answer is ${step.answer}.`
        : step.type === "output" ? `They answered "${num}". The correct output is "${step.expect}".`
        : step.type === "order" ? `Their order: ${orderSeq.join(" → ")}. Correct order: ${step.items.join(" → ")}.`
        : `Their code:\n${codeText}\nA working solution:\n${step.solution}`;
      const r = await askAI(
        `A learner just got this exercise wrong. In two short, concrete sentences, name the likely misconception and give them the mental model to fix it. Do not restate the question. No cheerleading.
Exercise: ${JSON.stringify({ type: step.type, prompt: step.prompt || step.heading, code: step.code })}
${given}
Respond with ONLY valid JSON: {"note":"..."}`,
        { maxTokens: 300 }
      );
      setTutorNote(String(r.note || "").trim() || "No note returned.");
    } catch (e) {
      setTutorNote(e.message === "NO_KEY" ? "Add an API key in Studio to unlock the tutor." : "Tutor unavailable: " + e.message);
    }
    setTutorBusy(false);
  };

  const advance = () => {
    if (!isGraded) setMark(idx, "read");
    if (idx + 1 >= lesson.steps.length) {
      const td = dayStr(0);
      let streak = learner.streak || 0;
      if (learner.lastDay === td) {}
      else if (learner.lastDay === dayStr(-1)) streak += 1;
      else streak = 1;
      const progress = { ...(learner.courseProgress || {}) };
      if (lessonSource && lessonSource.courseId !== undefined) {
        progress[lessonSource.courseId + ":" + lessonSource.u + ":" + lessonSource.l] = sRight + "/" + sTotal;
      }
      // spaced repetition + skill model updates
      if (lessonSource && lessonSource.review) {
        const nextDeck = deep(deckRef.current);
        const nextSkills = deep(skillsRef.current);
        lessonSource.review.forEach((id, i) => {
          const c = nextDeck.find((x) => x.id === id);
          if (!c) return;
          const ok = marks[i] === "right";
          bumpSkill(nextSkills, c.topic, ok ? 1 : 0, 0.25);
          if (ok) {
            c.interval = Math.ceil(c.interval * 2.5);
            c.due = dayStr(c.interval);
          } else {
            c.interval = 1;
            c.lapses += 1;
            c.due = dayStr(1);
          }
        });
        persistDeck(nextDeck.filter((c) => c.interval <= 21));
        persistSkills(nextSkills);
      } else if (sTotal > 0 && lessonTopic) {
        const nextSkills = deep(skillsRef.current);
        bumpSkill(nextSkills, lessonTopic, sRight / sTotal, 0.35);
        persistSkills(nextSkills);
      }
      const prevDay = learner.dayXp && learner.dayXp.d === td ? learner.dayXp.xp : 0;
      persistLearner({
        xp: (learner.xp || 0) + sXp,
        streak,
        lastDay: td,
        history: [{ t: lesson.title, d: td, s: sRight + "/" + sTotal }, ...(learner.history || [])].slice(0, 10),
        courseProgress: progress,
        dayXp: { d: td, xp: prevDay + sXp },
      });
      setScreen("done");
      return;
    }
    setIdx((i) => i + 1);
    setSel(null);
    setNum("");
    setChecked(false);
    setCorrect(false);
  };

  const exploreVal = () => {
    try {
      const r = math.evaluate(step.expr, { [step.variable]: Number(sliderVal) });
      return typeof r === "number" && isFinite(r) ? r : null;
    } catch (e) { return null; }
  };

  const lessonProgressOf = (course) => {
    let ready = 0, done = 0, total = 0;
    course.units.forEach((u, ui) =>
      u.lessons.forEach((l, li) => {
        total += 1;
        if (l.status === "ready") ready += 1;
        if ((learner.courseProgress || {})[course.id + ":" + ui + ":" + li]) done += 1;
      })
    );
    return { ready, done, total };
  };

  const activeCourse = activeCourseId ? library.courses.find((c) => c.id === activeCourseId) : null;
  const showTabs = screen === "home";
  const todayXp = learner.dayXp && learner.dayXp.d === today ? learner.dayXp.xp : 0;
  const topSkills = Object.entries(skills)
    .sort((a, b) => b[1].n - a[1].n)
    .slice(0, 5);

  return (
    <div className="page">
      <div className="margin-rule" />
      <div className="inner">
        {showTabs && (
          <div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", paddingTop: 24 }}>
              <span className="mono" style={{ fontSize: 13, fontWeight: 600, letterSpacing: ".2em" }}>PREXIS <span style={{ color: "var(--pencil)", letterSpacing: ".12em", fontWeight: 400 }}>· ADAPTIVE</span></span>
              <div style={{ display: "flex", gap: 8 }}>
                <span className="pill">STREAK {learner.streak || 0}</span>
                <span className="pill" style={todayXp >= prefs.goal ? { background: "var(--hi)", color: "var(--hi-ink)" } : {}}>TODAY {todayXp}/{prefs.goal}</span>
              </div>
            </div>
            <div style={{ display: "flex", gap: 18, marginTop: 18, borderBottom: "1.5px solid var(--box)" }}>
              {["learn", "studio", "style"].map((t) => (
                <button
                  key={t}
                  onClick={() => { setTab(t); setScreen("home"); }}
                  className="mono"
                  style={{
                    letterSpacing: ".14em", background: "none", border: "none", padding: "6px 2px 10px",
                    color: tab === t ? "var(--ink)" : "var(--pencil)",
                    borderBottom: tab === t ? "3px solid var(--ink)" : "3px solid transparent",
                    marginBottom: -1.5, fontWeight: tab === t ? 600 : 400, fontSize: 12,
                  }}
                >
                  {t.toUpperCase()}
                </button>
              ))}
            </div>
          </div>
        )}

        {screen === "onboard" && (
          <div style={{ paddingTop: 40 }}>
            <p className="kicker">PREXIS · SETUP {obStep + 1}/3</p>
            {obStep === 0 && (
              <div>
                <h1 className="display" style={{ fontWeight: 700, fontSize: 32, lineHeight: 1.1, margin: "14px 0 0" }}>Make it <span className="hi">yours.</span></h1>
                <p style={{ color: "var(--pencil)", fontSize: 14.5, lineHeight: 1.55, marginTop: 12 }}>
                  Pick the look you want to learn in. It applies instantly, and you can change it any time from the Style tab.
                </p>
                <SkinPicker current={prefs.skin || document.documentElement.getAttribute("data-skin")} onPick={(id) => persistPrefs({ ...prefs, skin: id })} />
                <button className="primary" style={{ marginTop: 24 }} onClick={() => setObStep(1)}>Next</button>
              </div>
            )}
            {obStep === 1 && (
              <div>
                <h1 className="display" style={{ fontWeight: 700, fontSize: 32, lineHeight: 1.1, margin: "14px 0 0" }}>How much have you coded?</h1>
                <p style={{ color: "var(--pencil)", fontSize: 14.5, lineHeight: 1.55, marginTop: 12 }}>
                  This sets your starting difficulty. Prexis re-tunes it automatically as you answer — every lesson watches what you get right.
                </p>
                <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 18 }}>
                  {[["Never, or barely", "Beginner"], ["Some — I can read code", "Intermediate"], ["A lot — challenge me", "Advanced"]].map(([label, lv]) => (
                    <button key={lv} className="opt" style={level === lv ? { borderColor: "var(--ink)", background: "var(--sel)" } : {}}
                      onClick={() => { setLevel(lv); setSLevel(lv); }}>
                      {label} <span className="mono" style={{ fontSize: 10, color: "var(--pencil)", marginLeft: 6 }}>{lv.toUpperCase()}</span>
                    </button>
                  ))}
                </div>
                <button className="primary" style={{ marginTop: 24 }} onClick={() => setObStep(2)}>Next</button>
              </div>
            )}
            {obStep === 2 && (
              <div>
                <h1 className="display" style={{ fontWeight: 700, fontSize: 32, lineHeight: 1.1, margin: "14px 0 0" }}>Daily goal</h1>
                <p style={{ color: "var(--pencil)", fontSize: 14.5, lineHeight: 1.55, marginTop: 12 }}>
                  A lesson is worth up to 60 XP. Small and daily beats heroic and rare.
                </p>
                <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
                  {[[30, "CASUAL"], [60, "STEADY"], [90, "SERIOUS"]].map(([g, name]) => (
                    <button key={g} className={"ghost" + (prefs.goal === g ? " on" : "")} style={{ flex: 1, padding: "12px 8px", fontSize: 12 }}
                      onClick={() => setPrefs({ ...prefs, goal: g })}>
                      {name}<br />{g} XP
                    </button>
                  ))}
                </div>

              <p className="mono" style={{ fontSize: 12, color: "var(--pen)", marginTop: 10 }}>★ DAILY GOAL HIT · {todayXp}/{prefs.goal}</p>
            )}
            <div style={{ display: "flex", justifyContent: "center", gap: 8, marginTop: 22 }}>
              <span className="pill">STREAK {learner.streak || 0}</span>
              <span className="pill">{learner.xp || 0} XP TOTAL</span>
            </div>
            <button
              className="primary"
              style={{ marginTop: 44 }}
              onClick={() => { setScreen(lessonSource && lessonSource.courseId !== undefined ? "course" : "home"); setLesson(null); }}
            >
              {lessonSource && lessonSource.courseId !== undefined ? "Back to course" : "New lesson"}
            </button>
          </div>
        )}

        {tab === "style" && screen === "home" && (
          <div>
            <p style={{ marginTop: 24, fontSize: 14, color: "var(--pencil)", lineHeight: 1.55 }}>
              Prexis adapts its brain to how you answer. This tab adapts its body to how you like to read.
            </p>

            <div style={{ marginTop: 20 }}>
              <p className="kicker">LOOK</p>
              <SkinPicker current={prefs.skin || document.documentElement.getAttribute("data-skin")} onPick={(id) => persistPrefs({ ...prefs, skin: id })} />
            </div>

            <div style={{ marginTop: 24 }}>
              <p className="kicker">TEXT SIZE</p>
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                {[["s", "SMALL"], ["m", "REGULAR"], ["l", "LARGE"]].map(([v, name]) => (
                  <button key={v} className={"ghost" + (prefs.size === v ? " on" : "")} onClick={() => persistPrefs({ ...prefs, size: v })}>{name}</button>
                ))}
              </div>
            </div>

            <div style={{ marginTop: 24 }}>
              <p className="kicker">PAGE WIDTH</p>
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button className={"ghost" + (!prefs.wide ? " on" : "")} onClick={() => persistPrefs({ ...prefs, wide: false })}>FOCUS</button>
                <button className={"ghost" + (prefs.wide ? " on" : "")} onClick={() => persistPrefs({ ...prefs, wide: true })}>WIDE</button>
              </div>
            </div>

            <div style={{ marginTop: 24 }}>
              <p className="kicker">HEADINGS</p>
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button className={"ghost" + (prefs.heads === "serif" ? " on" : "")} onClick={() => persistPrefs({ ...prefs, heads: "serif" })}>SERIF</button>
                <button className={"ghost" + (prefs.heads === "sans" ? " on" : "")} onClick={() => persistPrefs({ ...prefs, heads: "sans" })}>SANS</button>
              </div>
            </div>

            <div style={{ marginTop: 24 }}>
              <p className="kicker">DAILY GOAL</p>
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                {[30, 60, 90].map((g) => (
                  <button key={g} className={"ghost" + (prefs.goal === g ? " on" : "")} onClick={() => persistPrefs({ ...prefs, goal: g })}>{g} XP</button>
                ))}
              </div>
            </div>

            <div style={{ marginTop: 34 }}>
              <p className="kicker">DANGER</p>
              <button
                className="ghost"
                style={{ marginTop: 10, color: "var(--margin)", borderColor: "var(--margin)", padding: "10px 12px" }}
                onClick={() => {
                  if (!confirmReset) { setConfirmReset(true); return; }
                  persistLearner({ xp: 0, streak: 0, lastDay: null, history: [], courseProgress: {}, dayXp: null });
                  persistSkills({});
                  persistDeck([]);
                  setConfirmReset(false);
                }}
              >
                {confirmReset ? "SURE? THIS WIPES XP, MASTERY AND THE REVIEW DECK" : "RESET ALL PROGRESS"}
              </button>
              {confirmReset && (
                <button className="ghost" style={{ marginTop: 10, marginLeft: 8 }} onClick={() => setConfirmReset(false)}>CANCEL</button>
              )}
            </div>
          </div>
        )}

        {tab === "studio" && screen === "home" && (
          <div>
            <p style={{ marginTop: 24, fontSize: 14, color: "var(--pencil)", lineHeight: 1.55 }}>
              Your chosen AI engine writes the lessons on any subject. This page executes every generated solution against its own tests before a lesson ships, quiz answers get independently re-solved for verification, and your mastery record is fed back into every prompt.
            </p>

            <div style={{ marginTop: 20 }}>
              <p className="kicker">AI ENGINE</p>
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button className={"ghost" + (provider === "claude" ? " on" : "")} onClick={() => persistProvider("claude")}>CLAUDE · ANTHROPIC</button>
                <button className={"ghost" + (provider === "grok" ? " on" : "")} onClick={() => persistProvider("grok")}>GROK · XAI</button>
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 12 }}>
                <input
                  className="field"
                  type={showKey ? "text" : "password"}
                  value={provider === "claude" ? claudeKey : apiKey}
                  onChange={(e) => (provider === "claude" ? persistClaudeKey(e.target.value) : persistKey(e.target.value))}
                  placeholder={provider === "claude" ? "sk-ant-…" : "xai-…"}
                  autoCapitalize="off"
                  autoCorrect="off"
                  spellCheck={false}
                  style={{ fontFamily: "var(--mono)", fontSize: 14, fontWeight: 500 }}
                />
                <button className="ghost" onClick={() => setShowKey((s) => !s)} type="button">{showKey ? "HIDE" : "SHOW"}</button>
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
                {(provider === "claude" ? CLAUDE_MODELS : MODELS).map((m) => (
                  <button
                    key={m.id}
                    type="button"
                    onClick={() => (provider === "claude" ? persistClaudeModel(m.id) : persistModel(m.id))}
                    className={"ghost" + ((provider === "claude" ? claudeModel : modelId) === m.id ? " on" : "")}
                  >
                    {m.label}
                  </button>
                ))}
              </div>
              <p className="mono" style={{ fontSize: 11, color: aiKey().trim() ? "var(--pen)" : "var(--pencil)", marginTop: 10 }}>
                {aiKey().trim()
                  ? "● " + ((provider === "claude" ? CLAUDE_MODELS.find((m) => m.id === claudeModel) : MODELS.find((m) => m.id === modelId)) || {}).label + (provider === "claude" ? " · api.anthropic.com" : " · api.x.ai")
                  : "○ No key — Studio will use the local teacher"}
              </p>
              <p style={{ fontSize: 12, color: "var(--pencil)", lineHeight: 1.5, marginTop: 6 }}>
                {provider === "claude"
                  ? "Create a key at console.anthropic.com. It stays in this browser. Opus 5 writes the best lessons; Haiku 4.5 is the budget option."
                  : "Create a key at console.x.ai. It stays in this browser. Default model is grok-code-fast-1."}
              </p>
            </div>

            <div style={{ marginTop: 20 }}>
              <p className="kicker">SUBJECT</p>
              <input
                className="field"
                value={subject}
                onChange={(e) => setSubject(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") draftCourse(); }}
                placeholder="e.g. JavaScript fundamentals"
              />
              <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                {["Beginner", "Intermediate", "Advanced"].map((l) => (
                  <button key={l} onClick={() => setSLevel(l)} className={"ghost" + (sLevel === l ? " on" : "")}>{l.toUpperCase()}</button>
                ))}
              </div>
              <button onClick={draftCourse} disabled={drafting} className="primary" style={{ marginTop: 18 }}>{drafting ? "Drafting…" : "Draft course"}</button>
              {studioErr && <p style={{ marginTop: 10, fontSize: 13, color: "var(--margin)" }}>{studioErr}</p>}
            </div>

            <div style={{ marginTop: 30 }}>
              <p className="kicker">CONTENT LIBRARY</p>
              <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 12 }}>
                {library.courses.map((c) => {
                  const p = lessonProgressOf(c);
                  const open = expandedId === c.id;
                  const busyCourse = genState && genState.courseId === c.id;
                  return (
                    <div key={c.id} className="card">
                      <button onClick={() => setExpandedId(open ? null : c.id)} style={{ width: "100%", textAlign: "left", background: "none", border: "none", padding: "13px 14px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between" }}>
                          <span style={{ fontWeight: 800, fontSize: 15 }}>{c.title}</span>
                          <span className="mono" style={{ fontSize: 11, color: "var(--pencil)" }}>{open ? "−" : "+"}</span>
                        </div>
                        <p className="mono" style={{ fontSize: 11, color: "var(--pencil)", margin: "4px 0 0" }}>{c.level.toUpperCase()} · {p.ready}/{p.total} READY</p>
                      </button>
                      {open && (
                        <div style={{ padding: "0 14px 14px" }}>
                          {c.units.map((u, ui) => (
                            <div key={ui} style={{ marginTop: 8 }}>
                              <p className="kicker" style={{ fontSize: 10 }}>UNIT {ui + 1} · {u.title.toUpperCase()}</p>
                              {u.lessons.map((l, li) => {
                                const busy = genState && genState.courseId === c.id && genState.u === ui && genState.l === li;
                                return (
                                  <div key={li} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px dashed var(--rule)", gap: 8 }}>
                                    <span style={{ fontSize: 13.5, fontWeight: 500, flex: 1 }}>{l.title}</span>
                                    {busy ? (
                                      <span className="mono" style={{ fontSize: 10, color: "var(--pencil)" }}>{genState.phase === "writing" ? "WRITING…" : "CHECKING…"}</span>
                                    ) : l.status === "ready" ? (
                                      <span className="mono" style={{ fontSize: 10, color: l.flagged ? "var(--margin)" : "var(--pen)" }}>{l.flagged ? l.flagged + " FLAG" : "✓ VERIFIED"}</span>
                                    ) : (
                                      <span className="mono" style={{ fontSize: 10, color: "var(--pencil)" }}>TODO</span>
                                    )}
                                    {!busy && (
                                      <button onClick={() => generateOne(c.id, ui, li)} disabled={!!genState} className="ghost" style={{ opacity: genState ? 0.4 : 1 }}>
                                        {l.status === "ready" ? "REDO" : "GEN"}
                                      </button>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          ))}
                          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                            <button onClick={() => generateAll(c.id)} disabled={!!genState} className="primary" style={{ fontSize: 14, padding: "10px 12px", flex: 1 }}>{busyCourse ? "Generating…" : "Generate all"}</button>
                            <button
                              onClick={() => {
                                if (confirmDel === c.id) {
                                  const next = deep(libRef.current);
                                  next.courses = next.courses.filter((x) => x.id !== c.id);
                                  persistLib(next);
                                  setConfirmDel(null);
                                } else setConfirmDel(c.id);
                              }}
                              className="ghost"
                              style={{ color: "var(--margin)", borderColor: "var(--margin)", padding: "10px 12px" }}
                            >
                              {confirmDel === c.id ? "SURE?" : "DELETE"}
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Prexis />);
</script>
</body>
</html>
