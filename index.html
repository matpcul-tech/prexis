<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const LEARNER_KEY = "prexis-learner-v1";
const LIB_KEY = "prexis-library-v1";
const PREFS_KEY = "prexis-prefs-v1";
const PROJECT_KEY = "prexis-project-v1";
const SKILLS_KEY = "prexis-skills-v1";
const DECK_KEY = "prexis-deck-v1";
const KEY_KEY = "prexis-xai-key";
const MODEL_KEY = "prexis-xai-model";
const PROVIDER_KEY = "prexis-provider";
const CLAUDE_KEY_KEY = "prexis-claude-key";
const CLAUDE_MODEL_KEY = "prexis-claude-model";
const XAI_URL = "https://api.x.ai/v1/chat/completions";
const ANTHROPIC_URL = "https://api.anthropic.com/v1/messages";
const MODELS = [
  { id: "grok-code-fast-1", label: "GROK CODE" },
  { id: "grok-4.6", label: "GROK 4.6" },
  { id: "grok-4.1-fast", label: "GROK FAST" },
];
const DEFAULT_MODEL = "grok-code-fast-1";
const CLAUDE_MODELS = [
  { id: "claude-opus-5", label: "OPUS 5" },
  { id: "claude-sonnet-5", label: "SONNET 5" },
  { id: "claude-haiku-4-5", label: "HAIKU 4.5" },
];
const DEFAULT_CLAUDE_MODEL = "claude-opus-5";
const TRY_TOPICS = ["Email marketing", "Photography basics", "Negotiation", "Public speaking", "Time management"];

const SKINS = [
  { id: "notebook", name: "Notebook", note: "Ruled paper, red margin", dots: ["#F7F3EA", "#1A1914", "#FFE24A"] },
  { id: "chalk", name: "Chalkboard", note: "Dark board, soft chalk", dots: ["#22332E", "#F1EEE2", "#F5D76E"] },
  { id: "terminal", name: "Terminal", note: "Phosphor on black", dots: ["#0D1117", "#E2E8E2", "#2EA043"] },
  { id: "gallery", name: "Gallery", note: "Clean white, indigo", dots: ["#FFFFFF", "#17181C", "#4F46E5"] },
];
const DEFAULT_PREFS = { skin: null, size: "m", wide: false, heads: "serif", goal: 60, onboarded: false, sound: true, haptics: true };

/* Tiny synth for feedback sounds. No assets, created lazily on first tap. */
let _audioCtx = null;
const playNotes = (notes, type, gain) => {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    let t = ctx.currentTime;
    notes.forEach(([freq, dur]) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ctx.destination);
      o.start(t);
      o.stop(t + dur);
      t += dur * 0.85;
    });
  } catch (e) {}
};
const SFX = {
  right: () => playNotes([[660, 0.09], [880, 0.12]], "sine", 0.05),
  wrong: () => playNotes([[220, 0.16]], "square", 0.03),
  done: () => playNotes([[523, 0.1], [659, 0.1], [784, 0.18]], "sine", 0.05),
};
const HAPTIC = { right: [20], wrong: [60], done: [30, 40, 30] };

const lessonSchema = `Allowed step types:
concept: {"type":"concept","heading":"3 to 6 words","body":"2 or 3 short plain sentences teaching one idea","code":"optional short JavaScript snippet"}
worked: {"type":"worked","heading":"3 to 6 words","problem":"one concrete problem stated in a sentence","steps":["first move and the reasoning behind it","second move","final move giving the answer"],"takeaway":"one memorable sentence stating the rule used","code":"optional snippet the problem refers to"}, a worked example the learner reveals one step at a time. steps is 3 to 5 short strings that SOLVE the problem completely. Not graded.
mcq: {"type":"mcq","prompt":"one clear question","options":["a","b","c","d"],"answer":0,"explain":"1 or 2 sentences on why","code":"optional snippet the question refers to"}
numeric: {"type":"numeric","prompt":"...","answer":12.5,"tolerance":0.5,"explain":"..."} where a numeric step SHOULD also carry "gen":{"vars":{"n":[4,12,2]},"answer":"n*3","round":0} whenever the question is formulaic: vars are named [min,max,step] ranges, gen.answer is a mathjs expression over them, plus "prompt" and "explain" INSIDE gen: copies of the step prompt and explain with every rolled number written as {n}. The step-level prompt and explain stay concrete. This lets the app re-roll the question with fresh numbers forever.
order: {"type":"order","prompt":"instruction to arrange the items","items":["first","second","third","fourth"],"explain":"...","codeItems":false} where items MUST already be listed in the correct order. Set codeItems to true only when the items are lines of code.
output: {"type":"output","code":"const a = [1, 2];\\nconsole.log(a.length);","prompt":"What does this print?","expect":"2","explain":"..."} where code is valid JavaScript that runs without errors and prints via console.log, and expect is the exact printed output.
code: {"type":"code","prompt":"one small clear coding task","starter":"function add(a, b) {\\n  \\n}","tests":[{"call":"add(2, 3)","expect":5},{"call":"add(0, 0)","expect":0}],"solution":"function add(a, b) {\\n  return a + b;\\n}","explain":"1 or 2 sentences"} where tests are expressions calling the learner's JavaScript, expect is the exact return value as JSON, and solution MUST pass every test.
explore: {"type":"explore","heading":"...","body":"tell the learner what to notice as they drag","expr":"1000*(1+r)^10","variable":"r","min":0,"max":0.2,"stepSize":0.005,"label":"rate","valueLabel":"balance"} where expr is a plain math expression using only numbers and the single variable, evaluable by mathjs.
Rules: 7 or 8 steps total. Step 1 is a concept. Step 2 is a worked example ("worked") that solves one problem of the same kind the graded steps will ask, so the learner is taught the method before being tested on it. Include exactly 4 graded steps (mcq, numeric, order, output or code). If the topic is programming: use JavaScript only, include exactly one code step and at least one output step, and keep every snippet under 8 short lines. If the topic is not programming: do not use code, output or codeItems, and include one explore step only if the topic is quantitative. Every question must be solvable from the concept steps plus light reasoning. Difficulty rises gently. No trick questions. "answer" for mcq is a 0-based index. Voice: direct, specific, no cheerleading. Never use em dashes or en dashes in any text; use commas, colons, or periods instead.`;

const parseJsonLoose = (text) => {
  if (text == null) throw new Error("empty model response");
  let clean = String(text).replace(/```json|```/g, "").trim();
  const start = clean.indexOf("{");
  const end = clean.lastIndexOf("}");
  if (start >= 0 && end > start) clean = clean.slice(start, end + 1);
  return JSON.parse(clean);
};

async function askGrok(prompt, { key, model, maxTokens, signal } = {}) {
  if (!key) throw new Error("NO_KEY");
  const res = await fetch(XAI_URL, {
    method: "POST",
    signal,
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + key,
    },
    body: JSON.stringify({
      model: model || DEFAULT_MODEL,
      temperature: 0.2,
      max_tokens: maxTokens || 2200,
      messages: [
        {
          role: "system",
          content: "You are Grok Code building Prexis lessons. Reply with ONLY valid JSON. No markdown fences, no preamble, no trailing commentary.",
        },
        { role: "user", content: prompt },
      ],
    }),
  });
  const raw = await res.text();
  let data;
  try { data = JSON.parse(raw); } catch (e) { throw new Error("Bad response from xAI"); }
  if (!res.ok) {
    const msg = (data.error && (data.error.message || data.error)) || ("HTTP " + res.status);
    throw new Error(String(msg));
  }
  const text =
    (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) ||
    data.output_text ||
    "";
  return parseJsonLoose(text);
}

async function askClaude(prompt, { key, model, maxTokens, signal } = {}) {
  if (!key) throw new Error("NO_KEY");
  const res = await fetch(ANTHROPIC_URL, {
    method: "POST",
    signal,
    headers: {
      "Content-Type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: model || DEFAULT_CLAUDE_MODEL,
      // generous cap: on Opus/Sonnet 5, adaptive thinking tokens count toward max_tokens
      max_tokens: Math.max(maxTokens || 3000, 8192),
      system: "You are Claude building Prexis lessons. Reply with ONLY valid JSON. No markdown fences, no preamble, no trailing commentary.",
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const raw = await res.text();
  let data;
  try { data = JSON.parse(raw); } catch (e) { throw new Error("Bad response from Anthropic"); }
  if (!res.ok) {
    const msg = (data.error && (data.error.message || data.error)) || ("HTTP " + res.status);
    throw new Error(String(msg));
  }
  if (data.stop_reason === "refusal") throw new Error("Claude declined this request.");
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  return parseJsonLoose(text);
}

const deep = (x) => JSON.parse(JSON.stringify(x));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
/* Parameterized questions, Brilliant-style: a numeric step may carry
   gen = { vars, answer, round?, tolerance?, show? }. vars are named
   [min, max, step] ranges; answer is a mathjs expression over them;
   show holds derived values for the explain text. The step is re-rolled
   at every launch, so replays and practice runs never repeat numbers.
   Any error falls back to the authored step unchanged. */
const genFmt = (v) => {
  if (typeof v !== "number" || !isFinite(v)) return String(v);
  const r = Math.round(v * 100) / 100;
  return Number.isInteger(r) && Math.abs(r) >= 1000 ? r.toLocaleString("en-US") : String(r);
};
/* Pools remember the member they served last time (per step, in plain
   localStorage) so a replay NEVER repeats the same question twice in a
   row. Storage failures fall back to a plain random pick. */
let SERVED_CACHE = null;
const pickFromPool = (s, poolLen) => {
  let idx = Math.floor(Math.random() * poolLen);
  if (poolLen < 2) return idx;
  try {
    if (!SERVED_CACHE) SERVED_CACHE = JSON.parse(localStorage.getItem("prexis-served-v1") || "{}") || {};
    const key = (s.type + ":" + String(s.prompt || "").slice(0, 60)).toLowerCase();
    if (idx === SERVED_CACHE[key]) idx = (idx + 1) % poolLen;
    SERVED_CACHE[key] = idx;
    const keys = Object.keys(SERVED_CACHE);
    if (keys.length > 400) keys.slice(0, 100).forEach((k) => delete SERVED_CACHE[k]);
    localStorage.setItem("prexis-served-v1", JSON.stringify(SERVED_CACHE));
  } catch (e) {}
  return idx;
};

const rollStep = (s) => {
  if (!s || !s.gen) return s;
  try {
    // variant pools (mcq, code, order): rotate through authored alternates
    if (Array.isArray(s.gen.variants) && s.gen.variants.length && ["mcq", "code", "order"].includes(s.type)) {
      const pool = [null, ...s.gen.variants];
      const v = pool[pickFromPool(s, pool.length)];
      if (!v) return s;
      if (s.type === "mcq") {
        if (!v.prompt || !Array.isArray(v.options) || v.options.length < 3 || typeof v.answer !== "number" || v.answer < 0 || v.answer >= v.options.length) return s;
        return { ...s, prompt: v.prompt, options: v.options, answer: v.answer, explain: v.explain || s.explain, code: v.code !== undefined ? v.code : s.code, rolled: true };
      }
      if (s.type === "code") {
        if (!v.prompt || !v.starter || !v.solution || !Array.isArray(v.tests) || !v.tests.length) return s;
        return { ...s, prompt: v.prompt, starter: v.starter, tests: v.tests, solution: v.solution, explain: v.explain || s.explain, rolled: true };
      }
      if (!v.prompt || !Array.isArray(v.items) || v.items.length < 3) return s;
      return { ...s, prompt: v.prompt, items: v.items, explain: v.explain || s.explain, codeItems: v.codeItems !== undefined ? v.codeItems : s.codeItems, rolled: true };
    }
    if ((s.type !== "numeric" && s.type !== "output") || (!s.gen.vars && !s.gen.pick)) return s;
    const vals = {};
    for (const [k, spec] of Object.entries(s.gen.vars || {})) {
      const [min, max, st] = spec.map(Number);
      const count = Math.floor((max - min) / st + 1e-9) + 1;
      vals[k] = Math.round((min + st * Math.floor(Math.random() * count)) * 1e6) / 1e6;
    }
    const shown = { ...vals };
    for (const [k, list] of Object.entries(s.gen.pick || {})) {
      shown[k] = list[Math.floor(Math.random() * list.length)];
    }
    for (const [k, expr] of Object.entries(s.gen.show || {})) {
      const v = math.evaluate(expr, { ...vals });
      shown[k] = Math.round(v * 100) / 100;
    }
    const sub = (t) => (typeof t === "string" ? t.replace(/\{(\w+)\}/g, (m, k) => (k in shown ? genFmt(shown[k]) : m)) : t);
    // templates live inside gen so the authored concrete text is the fallback
    if (s.type === "output") {
      return {
        ...s,
        prompt: sub(s.gen.prompt || s.prompt),
        code: sub(s.gen.code || s.code),
        expect: sub(s.gen.expect != null ? s.gen.expect : s.expect),
        explain: sub(s.gen.explain || s.explain),
        rolled: true,
      };
    }
    const ans = math.evaluate(s.gen.answer, { ...vals });
    if (typeof ans !== "number" || !isFinite(ans)) return s;
    const digits = s.gen.round != null ? s.gen.round : 2;
    const answer = Math.round(ans * Math.pow(10, digits)) / Math.pow(10, digits);
    shown.A = answer;
    const out = { ...s, prompt: sub(s.gen.prompt || s.prompt), explain: sub(s.gen.explain || s.explain), answer, rolled: true };
    if (s.gen.tolerance != null) out.tolerance = s.gen.tolerance;
    return out;
  } catch (e) {
    return s;
  }
};

const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const fmt = (n) => {
  if (n === null || n === undefined) return "…";
  const a = Math.abs(n);
  if (a >= 1000) return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  if (a >= 1) return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
  return Number(n.toPrecision(3)).toString();
};

    try {
      if (c.cssContains) return { label: c.label, pass: String(cssText || "").includes(c.cssContains) };
      const els = Array.from(doc.body.querySelectorAll(c.sel));
      let pass = false;
      if (c.exists) pass = els.length > 0;
      else if (c.count) pass = els.length >= c.count;
      else if (c.attr && c.every) pass = els.length > 0 && els.every((el) => ((el.getAttribute(c.attr) || "").trim().length > 0));

        const v = win.getComputedStyle(el)[c.style];

const runJS = async (code) => {
  const logs = [];
  const fake = {
    log: (...a) => logs.push(a.map((x) => (typeof x === "object" ? JSON.stringify(x) : String(x))).join(" ")),
  };
  try {
    const fn = new Function("console", code);
    const ret = fn(fake);
    if (ret && typeof ret.then === "function") await ret;
    await Promise.resolve();
    await Promise.resolve();
    return { ok: true, logs, error: null };
  } catch (e) {
    return { ok: false, logs, error: String(e) };
  }
};

const runOneTest = async (userCode, t) => {
  try {
    const fn = new Function("console", userCode + "\n;return (" + t.call + ");");
    let got = fn({ log: () => {} });
    if (got && typeof got.then === "function") got = await got;
    const pass = JSON.stringify(got) === JSON.stringify(t.expect);
    return { call: t.call, expect: t.expect, got, pass, error: null };
  } catch (e) {
    return { call: t.call, expect: t.expect, got: undefined, pass: false, error: String(e) };
  }
};

const runTests = async (userCode, tests) => {

};

const tokensOf = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter((w) => w.length > 1 && !STOP_WORDS.has(w));

const LESSON_INDEX = (() => {

  CONTENT.courses.forEach((c) =>
    c.units.forEach((u, ui) =>
      u.lessons.forEach((l, li) => {
        const words = new Set([...tokensOf(l.title), ...(l.keywords || []).map((k) => String(k).toLowerCase()), ...tokensOf(c.subject)]);

/* Score a typed topic against the built-in library. 1 = every word matched. */
function findLocalLesson(topic) {
  const tw = tokensOf(topic);
  if (!tw.length) return null;
  let best = null, bestScore = 0;
  LESSON_INDEX.forEach((e) => {
    let hit = 0;
    tw.forEach((w) => { if (e.words.has(w)) hit += 1; });
    const score = hit / tw.length;
    if (score > bestScore) { bestScore = score; best = e; }
  });
  return best ? { ...best, score: bestScore } : null;
}

/* Greedy reorder so two cards of the same topic never sit adjacent. */
const interleaveByTopic = (cards) => {
  const pool = [...cards];
  const out = [];
  while (pool.length) {
    let i = pool.findIndex((c) => !out.length || topicKey(c.topic) !== topicKey(out[out.length - 1].topic));
    if (i < 0) i = 0;
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
};

/* An AI-written review variant must match the original's type and pass
   the same mechanical checks curated content does, or it is discarded. */
const validVariant = async (orig, v) => {
  if (!v || v.type !== orig.type) return false;
  if (v.type === "mcq") return !!v.prompt && Array.isArray(v.options) && v.options.length >= 3 && typeof v.answer === "number" && v.answer >= 0 && v.answer < v.options.length;
  if (v.type === "numeric") return !!v.prompt && typeof v.answer === "number" && isFinite(v.answer);
  if (v.type === "order") return !!v.prompt && Array.isArray(v.items) && v.items.length >= 3;
  if (v.type === "output") {
    if (!v.code || v.expect === undefined) return false;
    const r = await runJS(v.code);
    return r.ok && r.logs.join("\n").trim() === String(v.expect).trim();
  }
  if (v.type === "code") {
    if (!v.solution || !v.starter || !Array.isArray(v.tests) || !v.tests.length) return false;
    const res = await runTests(v.solution, v.tests);
    return res.length > 0 && res.every((r) => r.pass);
  }
  return false;
};

}

async function verifyLesson(gen) {
  let flagged = 0;
  for (const s of gen.steps) {
    if (s.type === "code" && s.solution && Array.isArray(s.tests)) {
      const res = await runTests(s.solution, s.tests);
      s.verified = res.length > 0 && res.every((r) => r.pass);
      if (!s.verified) flagged += 1;
    }
    if (s.type === "output" && s.code) {
      const r = await runJS(s.code);
      const printed = r.logs.join("\n").trim();
      s.verified = r.ok && printed === String(s.expect).trim();
      if (!s.verified) flagged += 1;
    }
    if (s.type === "mcq" && (s.answer < 0 || s.answer >= (s.options || []).length)) {
      s.verified = false;
      flagged += 1;
    }
  }
  return flagged;
}

function localCourse(subject, level) {
  const s = subject.trim();
  const codeish = /code|script|program|web|react|data|sql|python|java/.test(s.toLowerCase());
  const units = codeish
    ? [
        { title: "Foundations", lessons: ["Names and values", "Control flow", "Small functions"] },
        { title: "Working memory", lessons: ["Structures", "Errors you can read", "A tiny project"] },
      ]
    : [
        { title: "See the shape", lessons: ["The one idea", "A worked example", "Common mistakes"] },
        { title: "Use it", lessons: ["A short drill", "Transfer problem", "Teach it back"] },
      ];
  return {
    id: Date.now().toString(36),
    subject: s,
    level,
    title: s,
    units: units.map((u) => ({
      title: u.title,
      lessons: u.lessons.map((lt) => ({ title: lt, status: "todo", steps: [], flagged: 0 })),
    })),
  };
}

/* Whitespace/grammar tidy for generated lessons: collapses doubled
   spaces and trims prose fields. Code fields are never touched. */
const tidyStr = (v) => (typeof v === "string" ? v.replace(/[ \t]+/g, " ").replace(/\s*\u2014\s*/g, ", ").replace(/(\d)\u2013(\d)/g, "$1-$2").replace(/\s*\u2013\s*/g, ", ").replace(/ ([,.;:!?])/g, "$1").trim() : v);
function tidyLesson(gen) {
  if (!gen) return gen;
  gen.title = tidyStr(gen.title);
  (gen.steps || []).forEach((st) => {
    ["heading", "body", "prompt", "explain", "problem", "takeaway", "label", "valueLabel"].forEach((k) => {
      if (st[k]) st[k] = tidyStr(st[k]);
    });
    if (Array.isArray(st.options)) st.options = st.options.map(tidyStr);
    if (Array.isArray(st.items) && !st.codeItems) st.items = st.items.map(tidyStr);
    if (st.type === "worked" && Array.isArray(st.steps)) st.steps = st.steps.map(tidyStr);
  });
  return gen;
}

const HL_RE = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)|(\b(?:const|let|var|function|return|if|else|for|while|new|typeof|await|async|of|in|class|try|catch|throw|true|false|null|undefined|this)\b)/g;
const HL_STYLE = {
  com: { color: "var(--pencil)", fontStyle: "italic" },
  str: { color: "var(--pen)" },
  num: { fontWeight: 600 },
  kw: { color: "var(--margin)", fontWeight: 600 },
};
function highlightCode(code) {
  const out = [];
  let last = 0, m;
  HL_RE.lastIndex = 0;
  while ((m = HL_RE.exec(code))) {
    if (m.index > last) out.push({ t: "plain", s: code.slice(last, m.index) });
    out.push({ t: m[1] ? "com" : m[2] ? "str" : m[3] ? "num" : "kw", s: m[0] });
    last = m.index + m[0].length;
  }
  if (last < code.length) out.push({ t: "plain", s: code.slice(last) });
  return out;
}
/* A code sample is offered as an editable sandbox only when it looks like
   runnable JavaScript (not CSS, HTML, or an error-message exhibit). */
const looksRunnableJS = (code) =>
  typeof code === "string" &&
  /(?:^|\n)\s*(?:const|let|var|function|async|Promise|console)\b/.test(code) &&
  !/<[a-z!\/]/i.test(code) &&
  !/^\s*[.#:@]/m.test(code) &&
  !/^\s+at /m.test(code);

function ExploreGraph({ step, value }) {
  const W = 320, H = 150, P = 14;
  const data = useMemo(() => {
    const min = Number(step.min), max = Number(step.max);
    if (!isFinite(min) || !isFinite(max) || max <= min) return null;
    const pts = [];
    for (let i = 0; i <= 80; i++) {
      const x = min + ((max - min) * i) / 80;
      try {
        const y = math.evaluate(step.expr, { [step.variable]: x });
        if (typeof y === "number" && isFinite(y)) pts.push([x, y]);
      } catch (e) {}
    }
    if (pts.length < 2) return null;
    let lo = Infinity, hi = -Infinity;
    pts.forEach((p) => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); });
    if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
    return { pts, lo, hi, min, max };
  }, [step]);
  if (!data) return null;
  const sx = (x) => P + ((x - data.min) / (data.max - data.min)) * (W - 2 * P);
  const sy = (y) => H - P - ((y - data.lo) / (data.hi - data.lo)) * (H - 2 * P);
  const path = data.pts.map((p, i) => (i ? "L" : "M") + sx(p[0]).toFixed(1) + " " + sy(p[1]).toFixed(1)).join(" ");
  let marker = null;
  try {
    const y = math.evaluate(step.expr, { [step.variable]: Number(value) });
    if (typeof y === "number" && isFinite(y)) {
      marker = { x: sx(Math.max(data.min, Math.min(data.max, Number(value)))), y: sy(Math.max(data.lo, Math.min(data.hi, y))) };
    }
  } catch (e) {}
  return (
    <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", display: "block", marginTop: 12 }} aria-hidden="true">
      <line x1={P} y1={H - P} x2={W - P} y2={H - P} stroke="var(--box)" strokeWidth="1.5" />
      <line x1={P} y1={P} x2={P} y2={H - P} stroke="var(--box)" strokeWidth="1.5" />
      <text x={P + 3} y={H - 3} fill="var(--pencil)" fontSize="9" fontFamily="var(--mono)">{fmt(data.min)}</text>
      <text x={W - P} y={H - 3} fill="var(--pencil)" fontSize="9" textAnchor="end" fontFamily="var(--mono)">{fmt(data.max)}</text>
      <text x={P + 3} y={P + 1} fill="var(--pencil)" fontSize="9" fontFamily="var(--mono)">{fmt(data.hi)}</text>
      <path d={path} fill="none" stroke="var(--pen)" strokeWidth="2.5" strokeLinejoin="round" />
      {marker && <circle cx={marker.x} cy={marker.y} r="5.5" fill="var(--hi)" stroke="var(--ink)" strokeWidth="1.5" />}
    </svg>
  );
}

/* Per-subject mastery history: single-series line on a fixed 0-100 scale.
   One axis, recessive dashed guides at the 55/85 difficulty thresholds,
   hover shows the nearest recorded point. */
function SkillHistory({ hist }) {
  const W = 320, H = 150, P = 16;
  const [hov, setHov] = useState(null);
  const pts = (hist || []).filter((h) => h && isFinite(h.e));
  if (pts.length < 2) {
    return (
      <p className="mono" style={{ fontSize: 11, color: "var(--pencil)", marginTop: 12, letterSpacing: ".04em" }}>
        {pts.length === 1 ? "ONE SESSION RECORDED. THE GRAPH APPEARS AT TWO." : "HISTORY STARTS RECORDING FROM YOUR NEXT SESSION."}
      </p>
    );
  }
  const sx = (i) => P + (i / (pts.length - 1)) * (W - 2 * P);
  const sy = (e) => H - P - (Math.max(0, Math.min(100, e)) / 100) * (H - 2 * P);
  const path = pts.map((p, i) => (i ? "L" : "M") + sx(i).toFixed(1) + " " + sy(p.e).toFixed(1)).join(" ");
  const onMove = (ev) => {
    const box = ev.currentTarget.getBoundingClientRect();
    const x = ((ev.clientX - box.left) / box.width) * W;
    let best = 0, bd = Infinity;
    pts.forEach((p, i) => { const d = Math.abs(sx(i) - x); if (d < bd) { bd = d; best = i; } });
    setHov(best);
  };
  const shortDate = (d) => { const m = /^\d{4}-(\d{2})-(\d{2})$/.exec(d || ""); return m ? Number(m[1]) + "/" + Number(m[2]) : d; };
  const hi = hov == null ? pts.length - 1 : hov;
  const hp = pts[hi];
  return (
    <div style={{ marginTop: 12 }}>
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", display: "block", touchAction: "none" }}
        onPointerMove={onMove} onPointerLeave={() => setHov(null)}>
        <line x1={P} y1={H - P} x2={W - P} y2={H - P} stroke="var(--box)" strokeWidth="1.5" />
        <line x1={P} y1={P} x2={P} y2={H - P} stroke="var(--box)" strokeWidth="1.5" />
        {[55, 85].map((g) => (
          <line key={g} x1={P} y1={sy(g)} x2={W - P} y2={sy(g)} stroke="var(--box)" strokeWidth="1" strokeDasharray="3 4" />
        ))}
        <text x={W - P} y={sy(85) - 3} fill="var(--pencil)" fontSize="8" textAnchor="end" fontFamily="var(--mono)">ADVANCED 85</text>
        <text x={W - P} y={sy(55) - 3} fill="var(--pencil)" fontSize="8" textAnchor="end" fontFamily="var(--mono)">INTERMEDIATE 55</text>
        <text x={P - 2} y={sy(100) + 3} fill="var(--pencil)" fontSize="9" textAnchor="end" fontFamily="var(--mono)">100</text>
        <text x={P - 2} y={sy(0) + 3} fill="var(--pencil)" fontSize="9" textAnchor="end" fontFamily="var(--mono)">0</text>
        <text x={P + 2} y={H - 3} fill="var(--pencil)" fontSize="9" fontFamily="var(--mono)">{shortDate(pts[0].d)}</text>
        <text x={W - P} y={H - 3} fill="var(--pencil)" fontSize="9" textAnchor="end" fontFamily="var(--mono)">{shortDate(pts[pts.length - 1].d)}</text>
        <path d={path} fill="none" stroke="var(--pen)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {hov != null && <line x1={sx(hi)} y1={P} x2={sx(hi)} y2={H - P} stroke="var(--box)" strokeWidth="1" />}
        <circle cx={sx(hi)} cy={sy(hp.e)} r="4.5" fill="var(--hi)" stroke="var(--ink)" strokeWidth="1.5" />
      </svg>
      <p className="mono" style={{ fontSize: 10, color: "var(--pencil)", margin: "4px 0 0", letterSpacing: ".06em", textAlign: "right" }}>
        {shortDate(hp.d)} · {Math.round(hp.e)}%{hov == null ? " (LATEST)" : ""}
      </p>
    </div>
  );
}

  /* ---- profile switching ---- */
  const activateProfile = async (reg) => {

  };
  const switchProfile = (id) => {

    activateProfile({ ...profiles, activeId: id });
  };
  const addProfile = (name) => {
    const nm = (name || "").trim() || "Learner " + (profiles.profiles.length + 1);
    const id = "u" + Date.now().toString(36);
    activateProfile({ profiles: [...profiles.profiles, { id, name: nm }], activeId: id });
  };

  const persistKey = async (k) => { setApiKey(k); try { await storage.set(KEY_KEY, k); } catch (e) {} };
  const persistModel = async (m) => { setModelId(m); try { await storage.set(MODEL_KEY, m); } catch (e) {} };
  const persistClaudeKey = async (k) => { setClaudeKey(k); try { await storage.set(CLAUDE_KEY_KEY, k); } catch (e) {} };
  const persistClaudeModel = async (m) => { setClaudeModel(m); try { await storage.set(CLAUDE_MODEL_KEY, m); } catch (e) {} };
  const persistProvider = async (p) => { setProvider(p); try { await storage.set(PROVIDER_KEY, p); } catch (e) {} };
  const persistLearner = async (next) => { setLearner(next); try { await storage.set(LEARNER_KEY, JSON.stringify(next)); } catch (e) {} };
  const persistLib = async (next) => { setLibrary(next); libRef.current = next; try { await storage.set(LIB_KEY, JSON.stringify(next)); } catch (e) {} };
  const persistPrefs = async (next) => { setPrefs(next); try { await storage.set(PREFS_KEY, JSON.stringify(next)); } catch (e) {} };
  const persistSkills = async (next) => { setSkills(next); skillsRef.current = next; try { await storage.set(SKILLS_KEY, JSON.stringify(next)); } catch (e) {} };
  const persistDeck = async (next) => { setDeck(next); deckRef.current = next; try { await storage.set(DECK_KEY, JSON.stringify(next)); } catch (e) {} };
  const persistProject = async (next) => { setProject(next); try { await storage.set(PROJECT_KEY, JSON.stringify(next)); } catch (e) {} };

  /* ---- backup: everything but API keys, as pasteable JSON ---- */
  const doExport = () => {
    const blob = JSON.stringify({
      v: 1,
      exported: new Date().toISOString(),
      learner,
      library: { ...library, courses: library.courses },
      prefs,
      skills,
      deck,
      project,
      provider,
      modelId,
      claudeModel,
    });
    setBackupText(blob);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(blob);
        setBackupMsg("Copied to clipboard, paste it somewhere safe (notes, email to yourself).");
      } else {
        setBackupMsg("Copy the text below and save it somewhere safe.");
      }
    } catch (e) {
      setBackupMsg("Copy the text below and save it somewhere safe.");
    }
  };
  const doImport = () => {
    try {
      const d = JSON.parse(backupText);
      if (!d || d.v !== 1) throw new Error("missing version marker");
      if (d.learner) persistLearner({ courseProgress: {}, dayXp: null, ...d.learner });
      if (d.library) persistLib(withBuiltins(d.library));
      if (d.prefs) persistPrefs({ ...DEFAULT_PREFS, ...d.prefs, onboarded: true });
      if (d.project) persistProject({ ...DEFAULT_PROJECT, ...d.project });
      if (d.skills) persistSkills(d.skills);
      if (Array.isArray(d.deck)) persistDeck(d.deck);
      if (d.provider) persistProvider(d.provider);
      if (d.modelId) persistModel(d.modelId);
      if (d.claudeModel) persistClaudeModel(d.claudeModel);
      setBackupMsg("Imported. XP, courses, mastery and review deck restored on this device.");
    } catch (e) {
      setBackupMsg("That doesn't look like a Prexis backup (" + e.message + ").");
    }
  };

  /* ---- adaptive engine ---- */
  const bumpSkill = (obj, topicLabel, score, w) => {
    const key = topicKey(topicLabel);
    if (!key) return;
    const cur = obj[key];
    const next = !cur
      ? { ema: score, n: 1, last: dayStr(0), label: String(topicLabel).trim(), hist: [] }
      : { ema: cur.ema * (1 - w) + score * w, n: cur.n + 1, last: dayStr(0), label: cur.label, hist: cur.hist || [] };
    next.hist = [...next.hist, { d: dayStr(0), e: Math.round(next.ema * 100) }].slice(-40);
    obj[key] = next;
  };
  const recLevel = (sk) => {
    if (!sk || sk.n < 2) return null;
    if (sk.ema >= 0.85) return "Advanced";
    if (sk.ema >= 0.55) return "Intermediate";
    return "Beginner";
  };
  const cardKeyOf = (s) => s.type + "::" + (s.prompt || s.heading || "");
  const addToDeck = (s) => {
    if (lessonSource && lessonSource.review) return;
    const key = cardKeyOf(s);
    if (deckRef.current.some((c) => c.key === key)) return;
    const card = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      key,
      topic: lessonTopic || "general",
      step: deep(s),
      // remember where this came from, so struggling cards can be re-taught
      src: lessonSource && lessonSource.courseId !== undefined
        ? { courseId: lessonSource.courseId, u: lessonSource.u, l: lessonSource.l }
        : null,
      due: dayStr(1),
      interval: 1,
      ease: 2.5,
      seen: 0,
      lapses: 0,
    };
    persistDeck([...deckRef.current, card].slice(-60));
  };
  const today = dayStr(0);
  const dueCards = deck.filter((c) => c.due <= today);

  /* Smart review session:
     - priority: most-lapsed first, then most overdue
     - interleaved so two cards of the same topic never sit adjacent
     - a card missed twice gets its lesson's concept + worked example
       replayed BEFORE the question (re-teach, then re-test)
     - with an AI key, questions are rewritten as fresh variants testing
       the same idea, each verified before use (originals on failure) */
  const startReview = async () => {
    const due = [...dueCards].sort((a, b) => (b.lapses - a.lapses) || a.due.localeCompare(b.due));
    const cards = interleaveByTopic(due.slice(0, 8));
    if (!cards.length) return;
    const variantByCard = {};
    if (aiKey().trim()) {
      setLoadingLabel("Smart review");
      setScreen("loading");
      try {
        const res = await askAI(
          `These practice questions were answered wrong before. For each one, write ONE fresh question testing the SAME idea with different surface details (different numbers, strings, names, or scenario). Keep the exact same "type" and JSON shape as the original, including a 1-2 sentence "explain". For type code: the solution MUST pass every one of its own tests. For type output: expect MUST be exactly what the code prints. For type order: items MUST be listed in the correct order.
Originals:
${JSON.stringify(cards.map((c, i) => ({ i, step: c.step })))}
Respond with ONLY valid JSON, no fences: {"variants":[{"i":0,"step":{...}}]}`,
          { maxTokens: 2600 }
        );
        for (const v of res.variants || []) {
          const c = cards[v.i];
          if (c && (await validVariant(c.step, v.step))) variantByCard[c.id] = v.step;
        }
      } catch (e) { console.error("variant generation failed", e); }
      setLoadingLabel(null);
    }
    const steps = [];
    const meta = []; // per-step: card id for graded steps, null for re-teach steps
    for (const c of cards) {
      if (c.lapses >= 2 && c.src && steps.length < 12) {
        const ls = contentLessonAt(c.src.courseId, c.src.u, c.src.l);
        if (ls) {
          const concept = ls.steps.find((s) => s.type === "concept");
          const worked = ls.steps.find((s) => s.type === "worked");
          if (concept) { steps.push(deep(concept)); meta.push(null); }
          if (worked && steps.length < 13) { steps.push(deep(worked)); meta.push(null); }
        }
      }
      steps.push(deep(variantByCard[c.id] || c.step));
      meta.push(c.id);
    }
    launchLesson({ title: "Smart review", steps }, { review: meta }, "");
  };

  useEffect(() => {
    if (screen !== "lesson" || !lesson) return;
    const s = lesson.steps[idx];
    if (s && s.type === "order" && Array.isArray(s.items)) {

      if (pool.length > 1 && pool.join("|") === s.items.join("|")) pool.push(pool.shift());
      setOrderPool(pool);
      setOrderSeq([]);

    if (s && s.type === "explore") setSliderVal((Number(s.min) + Number(s.max)) / 2);

      setShowSol(false);

    setWorkedN(0);
    setHintN(0);
    setRetries(0);
    setBuildResults(null);
    setRevealed(false);
    setElim([]);

    setTutorBusy(false);

  useEffect(() => {
    const onKey = (e) => {
      if (screen !== "lesson" || !lesson) return;
      const s = lesson.steps[idx];
      if (!s) return;
      if (checked && (correct || revealed) && e.key === "Enter") { e.preventDefault(); advance(); return; }
      if (checked) return;
      if (s.type === "mcq" && e.key >= "1" && e.key <= "4") {
        const i = Number(e.key) - 1;
        if (s.options[i] !== undefined && !elim.includes(i)) setSel(i);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  /* Shuffle MCQ options at launch so the right answer has no home position
     (both curated and AI lessons otherwise develop one). */
  const prepSteps = (steps) =>
    steps.map((s) => {
      s = rollStep(s);
      if (s.type === "mcq" && Array.isArray(s.options) && typeof s.answer === "number") {
        const idx = shuffle(s.options.map((_, i) => i));
        return { ...s, options: idx.map((i) => s.options[i]), answer: idx.indexOf(s.answer) };
      }
      return s;
    });

  const launchLesson = (parsed, source, topicStr) => {
    parsed = { ...parsed, steps: prepSteps(parsed.steps) };
    setLesson(parsed);
    setLessonSource(source);
    setLessonTopic(topicStr || "");
    setMarks(new Array(parsed.steps.length).fill(null));
    setHintMarks(new Array(parsed.steps.length).fill(0));

  const aiKey = () => (provider === "claude" ? claudeKey : apiKey);
  const aiName = () => (provider === "claude" ? "Claude" : "Grok");
  const askAI = (prompt, extra) => {
    if (provider === "claude") return askClaude(prompt, { key: claudeKey.trim(), model: claudeModel, ...extra });
    return askGrok(prompt, { key: apiKey.trim(), model: modelId, ...extra });
  };

  const adaptContext = (topicLabel) => {
    const key = topicKey(topicLabel);
    const sk = skillsRef.current[key];
    const missed = deckRef.current
      .filter((c) => topicKey(c.topic) === key)
      .slice(-3)
      .map((c) => c.step.prompt || c.step.heading)
      .filter(Boolean);
    const recent = (learner.history || []).slice(0, 5).map((h) => h.t);
    if (!sk && !missed.length && !recent.length) return "";
    let note = "";
    if (sk) note += `The learner's recent accuracy on this subject is ${Math.round(sk.ema * 100)}% over ${sk.n} sessions. Pitch difficulty accordingly. `;
    if (recent.length) note += `They recently completed lessons titled: ${recent.join("; ")}. Do NOT repeat that material, go further or take a genuinely new angle. `;
    if (missed.length) note += `They recently got these wrong: ${missed.join(" / ")}. Reteach those ideas from a fresh angle before testing them again.`;
    return note.trim();
  };

  /* Progression: a matched subject should not replay lesson 1 forever.
     Serve the preferred lesson if it's new, else the first unfinished
     lesson in that course, else the learner's weakest one to redo. */
  const nextInCourse = (courseId, preferred) => {
    const course = CONTENT.courses.find((c) => c.id === courseId);
    if (!course) return preferred;
    const prog = learner.courseProgress || {};
    const all = [];
    course.units.forEach((u, ui) => u.lessons.forEach((_, li) => all.push({ courseId, u: ui, l: li, key: courseId + ":" + ui + ":" + li })));
    if (!prog[courseId + ":" + preferred.u + ":" + preferred.l]) return preferred;
    const fresh = all.find((x) => !prog[x.key]);
    if (fresh) return fresh;
    const ratio = (s) => { const m = /^(\d+)\/(\d+)$/.exec(s || ""); return m && Number(m[2]) ? Number(m[1]) / Number(m[2]) : 1; };
    return all.reduce((worst, x) => (ratio(prog[x.key]) < ratio(prog[worst.key]) ? x : worst), all[0]);
  };

  /* Launch a curated lesson WITH its course identity, so completion is
     recorded and the next visit to this subject moves forward. */
  const launchFromLibrary = (courseId, u, l, topicStr) => {
    const pick = nextInCourse(courseId, { courseId, u, l });
    const ls = contentLessonAt(pick.courseId, pick.u, pick.l);
    if (!ls) return false;
    setActiveCourseId(pick.courseId);
    launchLesson({ title: ls.title, steps: deep(ls.steps) }, { courseId: pick.courseId, u: pick.u, l: pick.l, via: "quick" }, topicStr);
    return true;
  };

  const startQuick = async (t) => {
    const chosen = (t || topic).trim();
    if (!chosen) return;
    const sk = skills[topicKey(chosen)];
    const lvl = levelTouched ? level : (recLevel(sk) || level);
    if (!levelTouched && recLevel(sk)) setLevel(recLevel(sk));
    setErr("");
    // Curated library first: a strong match beats generating anything.
    // Without a key any decent match serves; with a key only a full match
    // short-circuits, so specific asks still get a custom AI lesson.
    const match = findLocalLesson(chosen);
    const threshold = aiKey().trim() ? 0.99 : 0.5;
    if (match && match.score >= threshold) {
      if (launchFromLibrary(match.courseId, match.u, match.l, chosen)) return;
    }
    if (!aiKey().trim()) {
      // Weak match still beats nothing; otherwise say so honestly instead
      // of serving the same generic filler lesson every time.
      if (match && match.score >= 0.34 && launchFromLibrary(match.courseId, match.u, match.l, chosen)) return;
      setErr(`“${chosen}” isn't in the built-in library yet. Add an API key in Studio and the AI will write a fresh lesson for it, or pick a library topic below.`);
      return;
    }
    setScreen("loading");
    try {
      let parsed = null;
      if (aiKey().trim()) {
        const ctx = adaptContext(chosen);
        parsed = await askAI(
          `Create one short interactive lesson teaching: "${chosen}". Learner level: ${lvl}.
${ctx ? ctx + "\n" : ""}Respond with ONLY valid JSON. No markdown fences, no text before or after. Keep the whole response under 700 words.
Schema: {"title":"short punchy lesson title","steps":[...]}
${lessonSchema}`,
          { maxTokens: 2500 }
        );
      }
      if (!parsed || !Array.isArray(parsed.steps) || parsed.steps.length === 0) throw new Error("bad shape");
      launchLesson(tidyLesson(parsed), null, chosen);
    } catch (e) {
      console.error(e);
      // AI failed: a related library lesson beats an error, but never
      // serve unrelated filler. It reads as the app repeating itself.
      if (match && match.score >= 0.34 && launchFromLibrary(match.courseId, match.u, match.l, chosen)) return;
      setErr(e.message === "NO_KEY"
        ? "Add an API key in Studio, or pick a built-in topic."
        : aiName() + " couldn't build that. " + (e.message || "Try again."));
      setScreen("home");
    }
  };

  const draftCourse = async () => {
    const s = subject.trim();
    if (!s || drafting) return;
    setStudioErr("");
    setDrafting(true);
    try {
      let outline;
      if (aiKey().trim()) {
        outline = await askAI(
          `Design a compact course teaching: "${s}". Learner level: ${sLevel}.
Respond with ONLY valid JSON, no fences, under 250 words.
{"title":"course title","units":[{"title":"unit title","lessons":["lesson title","lesson title","lesson title"]}]}
Exactly 2 units with exactly 3 lesson titles each, sequenced so difficulty builds. Titles under 6 words.`,
          { maxTokens: 800 }
        );
      } else {
        const c = localCourse(s, sLevel);
        outline = { title: c.title, units: c.units.map((u) => ({ title: u.title, lessons: u.lessons.map((l) => l.title) })) };
      }
      if (!outline || !Array.isArray(outline.units)) throw new Error("bad outline");
      const course = {
        id: Date.now().toString(36),
        subject: s,
        level: sLevel,
        title: outline.title || s,
        units: outline.units.map((u) => ({
          title: u.title,
          lessons: (u.lessons || []).map((lt) => ({ title: lt, status: "todo", steps: [], flagged: 0 })),
        })),
      };
      const next = deep(libRef.current);
      next.courses.unshift(course);
      await persistLib(next);
      setExpandedId(course.id);
      setSubject("");
    } catch (e) {
      console.error(e);
      setStudioErr(aiKey().trim() ? aiName() + " draft failed. " + (e.message || "Try again.") : "Course draft failed. Try again.");
    }
    setDrafting(false);
  };

  const generateOne = async (courseId, u, l) => {
    genCancelRef.current = false;
    setCancelledKey(null);
    const course = libRef.current.courses.find((c) => c.id === courseId);
    if (!course) return false;
    const unit = course.units[u];
    const lessonTitle = unit.lessons[l].title;
    const prior = [];
    course.units.forEach((uu, ui) =>
      uu.lessons.forEach((ll, li) => {
        if (ui < u || (ui === u && li < l)) prior.push(ll.title);
      })
    );
    setGenState({ courseId, u, l, phase: "writing" });
    // local generation is near-instant; hold each phase long enough to read
    if (!aiKey().trim()) await sleep(450);
    const ctrl = new AbortController();
    genAbortRef.current = ctrl;
    try {
      let gen;
      if (aiKey().trim()) {
        const ctx = adaptContext(course.subject);
        const writeLesson = () => askAI(
          `Write one interactive lesson.
Course: "${course.title}", learner level ${course.level}. Unit: "${unit.title}". This lesson: "${lessonTitle}".
Earlier lessons already covered: ${prior.join("; ") || "none"}. Build on them, do not repeat them.
${ctx ? ctx + "\n" : ""}Respond with ONLY valid JSON. No markdown fences, no text before or after. Under 700 words.
Schema: {"title":"${lessonTitle}","steps":[...]}
${lessonSchema}`,
          { maxTokens: 2500, signal: ctrl.signal }
        );
        try {
          gen = await writeLesson();
        } catch (e) {
          // one automatic retry on a transient API failure, visible as its own phase
          if (genCancelRef.current || e.name === "AbortError") throw e;
          setGenState({ courseId, u, l, phase: "retrying" });
          gen = await writeLesson();
        }
      } else {
        gen = localCourseLesson(course.subject || course.title, lessonTitle, course.level);
      }
      if (!gen || !Array.isArray(gen.steps) || gen.steps.length === 0) throw new Error("bad shape");
      tidyLesson(gen);
      gen.title = lessonTitle;

      setGenState({ courseId, u, l, phase: "checking" });
      if (!aiKey().trim()) await sleep(350);
      if (genCancelRef.current) { setGenState(null); return false; }
      let flagged = await verifyLesson(gen);

      const graded = gen.steps.map((s, i) => ({ s, i })).filter((x) => x.s.type === "mcq" || x.s.type === "numeric");
      if (aiKey().trim() && graded.length > 0) {
        setGenState({ courseId, u, l, phase: "verifying" });
        try {
          const ver = await askAI(
            `Solve these questions independently and carefully. Respond with ONLY valid JSON, no fences:
{"answers":[{"i":0,"answer":2}]}
For multiple choice, "answer" is the 0-based index of the correct option. For numeric, "answer" is the number.
Questions:
${graded
  .map((x) =>
    x.s.type === "mcq"
      ? `[${x.i}] MCQ: ${x.s.code ? "Code: " + x.s.code + " " : ""}${x.s.prompt} Options: ${x.s.options.map((o, j) => j + ": " + o).join(" | ")}`
      : `[${x.i}] NUMERIC: ${x.s.prompt}`
  )
  .join("\n")}`,
            { maxTokens: 600, signal: ctrl.signal }
          );
          const byI = {};
          (ver.answers || []).forEach((a) => { byI[a.i] = a.answer; });
          graded.forEach((x) => {
            const va = byI[x.i];
            let ok = false;
            if (x.s.type === "mcq") ok = Number(va) === Number(x.s.answer);
            else {
              const tol = typeof x.s.tolerance === "number" ? x.s.tolerance : Math.max(0.01, Math.abs(x.s.answer) * 0.01);
              ok = typeof va === "number" && Math.abs(va - x.s.answer) <= tol;
            }
            x.s.verified = ok;
            if (!ok) flagged += 1;
          });
        } catch (e) {
          console.error("verify failed", e);
        }
      }

      const next = deep(libRef.current);
      const nc = next.courses.find((c) => c.id === courseId);
      nc.units[u].lessons[l] = { title: lessonTitle, status: "ready", steps: gen.steps, flagged };
      await persistLib(next);
      setGenErrors((prev) => { const nx = { ...prev }; delete nx[courseId + ":" + u + ":" + l]; return nx; });
      setGenState(null);
      return true;
    } catch (e) {
      setGenState(null);
      if (genCancelRef.current || e.name === "AbortError") return false; // cancelled: no FAILED marker
      console.error(e);
      setGenErrors((prev) => ({ ...prev, [courseId + ":" + u + ":" + l]: String(e.message || "generation failed") }));
      return false;
    }
  };

  const generateAll = async (courseId) => {
    setStudioErr("");
    const course = libRef.current.courses.find((c) => c.id === courseId);
    if (!course) return;
    genCancelRef.current = false;
    const targets = [];
    course.units.forEach((u, ui) =>
      u.lessons.forEach((l, li) => { if (l.status !== "ready") targets.push({ u: ui, l: li }); })
    );
    setGenQueue(targets.map((t) => courseId + ":" + t.u + ":" + t.l));
    for (const t of targets) {
      if (genCancelRef.current) break;
      setGenQueue((q) => q.filter((k) => k !== courseId + ":" + t.u + ":" + t.l));
      await generateOne(courseId, t.u, t.l); // a failure marks the lesson FAILED and the queue moves on
      await sleep(150);
    }
    setGenQueue([]);
    setGenState(null);
  };

  const cancelGeneration = () => {
    genCancelRef.current = true;
    const st = genState;
    if (st) setCancelledKey(st.courseId + ":" + st.u + ":" + st.l);
    try { genAbortRef.current && genAbortRef.current.abort(); } catch (e) {}
    setGenQueue([]);
  };

  /* ---- in-Studio editor ---- */
  const renameCourse = (courseId, title) => {
    const next = deep(libRef.current);
    const c = next.courses.find((x) => x.id === courseId);
    if (!c) return;
    c.title = title;
    persistLib(next);
  };
  const renameLesson = (courseId, u, l, title) => {
    const next = deep(libRef.current);
    const c = next.courses.find((x) => x.id === courseId);
    if (!c) return;
    c.units[u].lessons[l].title = title;
    persistLib(next);
  };
  const addLessonTo = (courseId, u) => {
    const next = deep(libRef.current);
    const c = next.courses.find((x) => x.id === courseId);
    if (!c) return;
    c.units[u].lessons.push({ title: "New lesson", status: "todo", steps: [], flagged: 0 });
    persistLib(next);
  };
  /* Swap a lesson with its neighbor, and remap every positional record:
     progress scores, the resume pointer, and review-card sources, so
     they follow the lesson, not the slot. */
  const moveLesson = (courseId, u, l, dir) => {
    const next = deep(libRef.current);
    const c = next.courses.find((x) => x.id === courseId);
    if (!c) return;
    const arr = c.units[u].lessons;
    const j = l + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[l], arr[j]] = [arr[j], arr[l]];
    persistLib(next);
    const keyA = courseId + ":" + u + ":" + l;
    const keyB = courseId + ":" + u + ":" + j;
    const prog = { ...(learner.courseProgress || {}) };
    const a = prog[keyA], b = prog[keyB];
    if (b !== undefined) prog[keyA] = b; else delete prog[keyA];
    if (a !== undefined) prog[keyB] = a; else delete prog[keyB];
    let lastLesson = learner.lastLesson || null;
    if (lastLesson && lastLesson.courseId === courseId && lastLesson.u === u) {
      if (lastLesson.l === l) lastLesson = { ...lastLesson, l: j };
      else if (lastLesson.l === j) lastLesson = { ...lastLesson, l: l };
    }
    persistLearner({ ...learner, courseProgress: prog, lastLesson });
    const nd = deep(deckRef.current);
    let changed = false;
    nd.forEach((card) => {
      if (card.src && card.src.courseId === courseId && card.src.u === u) {
        if (card.src.l === l) { card.src.l = j; changed = true; }
        else if (card.src.l === j) { card.src.l = l; changed = true; }
      }
    });
    if (changed) persistDeck(nd);
  };
  const regenerateWeakest = (courseId) => {
    const course = libRef.current.courses.find((x) => x.id === courseId);
    if (!course) return;
    const prog = learner.courseProgress || {};
    let worst = null, worstR = 1.01;
    course.units.forEach((uu, ui) =>
      uu.lessons.forEach((ll, li) => {
        const v = prog[courseId + ":" + ui + ":" + li];
        if (!v || ll.status !== "ready") return;
        const m = /^(\d+)\/(\d+)$/.exec(v);
        const r = m && Number(m[2]) ? Number(m[1]) / Number(m[2]) : 1;
        if (r < worstR) { worstR = r; worst = { u: ui, l: li }; }
      })
    );
    if (!worst) { setStudioErr("Complete a lesson in this course first: \u201cweakest\u201d needs scores to compare."); return; }
    setStudioErr("");
    generateOne(courseId, worst.u, worst.l);
  };

  const startLibraryLesson = async (courseId, u, l) => {
    const course = library.courses.find((c) => c.id === courseId);
    const ls = course.units[u].lessons[l];
    if (ls.status !== "ready") return;
    let steps = ls.steps;
    const replayScore = (learner.courseProgress || {})[courseId + ":" + u + ":" + l];
    if (replayScore && aiKey().trim()) {
      // replaying a passed lesson with a key: re-test with verified fresh
      // variants instead of the questions the learner already answered
      const fixed = steps.map((st, i) => ({ st, i })).filter((x) => ["mcq", "numeric", "order", "output"].includes(x.st.type) && !x.st.gen);
      if (fixed.length) {
        setLoadingLabel("Fresh variants");
        setScreen("loading");
        try {
          const res = await askAI(
            `You are re-testing a learner who already passed this lesson once. For each question below, write ONE fresh variant testing the SAME idea with different surface details (different numbers, strings, names, or scenario). Keep the exact same "type" and JSON shape as the original, including a 1-2 sentence "explain". For type output: expect MUST be exactly what the code prints. For type order: items MUST be listed in the correct order.
Originals:
${JSON.stringify(fixed.map((x, k) => ({ i: k, step: x.st })))}
Respond with ONLY valid JSON, no fences: {"variants":[{"i":0,"step":{...}}]}`,
            { maxTokens: 2600 }
          );
          const next = deep(steps);
          for (const v of res.variants || []) {
            const x = fixed[v.i];
            if (x && (await validVariant(x.st, v.step))) next[x.i] = { ...v.step };
          }
          steps = next;
        } catch (e) { console.error("replay variants failed", e); }
        setLoadingLabel(null);
      }
    }
    launchLesson({ title: ls.title, steps }, { courseId, u, l }, course.subject);
  };

  /* Practice mode, Brilliant-style: an on-demand set of graded questions
     for one subject, drawn from its library lessons. Steps from lessons
     you scored low on are weighted heaviest, your open review misses for
     the subject lead the set, and parameterized questions re-roll, so no
     two practice runs are the same. */
  const startPractice = (label) => {
    const key = topicKey(label);
    const gradedT = ["mcq", "numeric", "order", "output", "code"];
    const pool = [];
    library.courses.forEach((c) => {
      if (topicKey(c.subject) !== key && topicKey(c.title) !== key) return;
      c.units.forEach((un, ui) =>
        un.lessons.forEach((l, li) => {
          if (l.status !== "ready" || !Array.isArray(l.steps)) return;
          const sc = (learner.courseProgress || {})[c.id + ":" + ui + ":" + li];
          let weight = 1.5; // unseen lessons: mildly preferred
          if (sc) {
            const [r, t] = String(sc).split("/").map(Number);
            weight = t ? 1 + (1 - r / t) * 3 : 1; // weak lessons: heavily preferred
          }
          l.steps.forEach((st) => { if (gradedT.includes(st.type)) pool.push({ st, weight, from: ui + ":" + li }); });
        })
      );
    });
    if (pool.length < 3) { startQuick(label); return; }
    const seen = new Set();
    const steps = [];
    // open review misses for this subject lead the set
    deck.filter((cd) => topicKey(cd.topic) === key)
      .sort((a, b) => (b.lapses || 0) - (a.lapses || 0))
      .slice(0, 2)
      .forEach((cd) => { const k = cardKeyOf(cd.step); if (!seen.has(k)) { seen.add(k); steps.push(deep(cd.step)); } });
    // weighted sample without replacement from the pool
    const bag = [...pool];
    let lastFrom = null;
    while (steps.length < 8 && bag.length) {
      const total = bag.reduce((a, x) => a + x.weight * (x.from === lastFrom ? 0.35 : 1), 0);
      let r = Math.random() * total;
      let pick = 0;
      for (let i = 0; i < bag.length; i++) {
        r -= bag[i].weight * (bag[i].from === lastFrom ? 0.35 : 1);
        if (r <= 0) { pick = i; break; }
      }
      const chosen = bag.splice(pick, 1)[0];
      const k = cardKeyOf(chosen.st);
      if (seen.has(k)) continue;
      seen.add(k);
      lastFrom = chosen.from;
      steps.push(deep(chosen.st));
    }
    if (steps.length < 3) { startQuick(label); return; }
    launchLesson({ title: "Practice: " + label, steps }, { via: "quick", practice: true }, label);
  };

  const step = lesson ? lesson.steps[idx] : null;
  const gradedTypes = ["mcq", "numeric", "order", "output", "code", "build"];
  const isGraded = step && gradedTypes.includes(step.type);
  const sharedControls = step && ["mcq", "numeric", "order", "output"].includes(step.type);

  const setMark = (i, v) => setMarks((m) => { const nx = [...m]; nx[i] = v; return nx; });
  const recordHints = (i) => setHintMarks((h) => { const nx = [...h]; nx[i] = hintN + retries; return nx; });
  const recordGain = (i, g) => setStepGains((a) => { const nx = [...a]; nx[i] = g; return nx; });

  const stepGain = () => Math.max(3, 15 - 5 * hintN - 5 * retries);

  const feedback = (kind) => {
    if (prefs.sound) SFX[kind] && SFX[kind]();
    if (prefs.haptics) { try { navigator.vibrate && navigator.vibrate(HAPTIC[kind] || [20]); } catch (e) {} }
  };

  /* Grade a build step by measuring the learner's RENDERED page. */
  const checkBuild = () => {
    const fr = buildFrameRef.current;
    if (!fr || !fr.contentDocument || !fr.contentWindow) return;
    const res = runBuildChecks(fr.contentDocument, fr.contentWindow, step.checks, project.css || "");
    setBuildResults(res);
    const ok = res.length > 0 && res.every((r) => r.pass);
    if (ok) {
      feedback("right");
      setChecked(true);
      setCorrect(true);
      setMark(idx, "right");
      recordHints(idx);
      setSTotal((x) => x + 1);
      const g = stepGain();
      setLastGain(g);
      recordGain(idx, g);
      setSXp((x) => x + g);
      setSRight((x) => x + 1);
    } else {
      feedback("wrong");
      setRetries((r) => r + 1);
    }
  };

  const check = () => {
    let ok = false;
    if (step.type === "mcq") ok = sel === step.answer;
    if (step.type === "numeric") {
      const v = parseFloat(num);
      const tol = typeof step.tolerance === "number" ? step.tolerance : 0.01;
      ok = !isNaN(v) && Math.abs(v - step.answer) <= tol;
    }
    if (step.type === "order") ok = orderSeq.length === step.items.length && orderSeq.every((it, i) => it === step.items[i]);
    if (step.type === "output") ok = num.trim() === String(step.expect).trim();
    setCorrect(ok);
    setChecked(true);
    recordHints(idx);
    if (ok) {
      feedback("right");
      setMark(idx, "right");
      setSTotal((x) => x + 1);
      const g = stepGain();
      setLastGain(g);
      recordGain(idx, g);
      setSXp((x) => x + g);
      setSRight((x) => x + 1);
    } else {
      feedback("wrong");
      if (retries === 0) addToDeck(step);
    }
  };

  /* Wrong answer: another attempt at reduced XP, without revealing the answer. */
  const retryStep = () => {
    setRetries((r) => r + 1);
    setChecked(false);
    setCorrect(false);
    setSel(null);
    setNum("");
    setTutorNote("");
    if (step.type === "order" && Array.isArray(step.items)) {
      let pool = shuffle(step.items);
      if (pool.length > 1 && pool.join("|") === step.items.join("|")) pool.push(pool.shift());
      setOrderPool(pool);
      setOrderSeq([]);
    }
  };
  const revealStep = () => {
    feedback("wrong");
    setRevealed(true);
    setMark(idx, "wrong");
    setSTotal((x) => x + 1);
  };

  const runCode = async () => {
    const res = await runTests(codeText, step.tests);
    setTestResults(res);
    setAttempts((a) => a + 1);
    if (res.length > 0 && res.every((r) => r.pass)) {
      feedback("right");
      const g = stepGain();
      setLastGain(g);
      recordGain(idx, g);
      setCorrect(true);
      setChecked(true);
      setMark(idx, "right");
      recordHints(idx);
      setSTotal((x) => x + 1);
      setSRight((x) => x + 1);
      setSXp((x) => x + g);
    }
  };

  const giveUp = () => {
    feedback("wrong");
    setShowSol(true);
    setCorrect(false);
    setChecked(true);
    setMark(idx, "wrong");
    setSTotal((x) => x + 1);
    addToDeck(step);
  };

  /* ---- hint ladder ---- */
  const hintLabel = () => {
    if (!step) return "HINT";
    if (step.type === "mcq") return "HINT · REMOVE A WRONG OPTION";
    if (step.type === "code") return "HINT · REVEAL NEXT SOLUTION LINE";
    if (step.type === "order") return "HINT · PLACE THE NEXT ITEM";
    if (step.type === "output") return "HINT · FIRST CHARACTER + LENGTH";
    if (step.type === "numeric") return "HINT · NARROW THE RANGE";
    return "HINT";
  };
  const hintAvailable = () => {
    if (!step || checked) return false;
    if (step.type === "mcq") return elim.length < Math.max(0, (step.options || []).length - 2);
    if (step.type === "code") return step.solution && revealN < step.solution.split("\n").length - 1;
    if (step.type === "order") return orderSeq.length < step.items.length;
    if (step.type === "output" || step.type === "numeric") return hintN === 0;
    return false;
  };
  const giveHint = () => {
    if (!hintAvailable()) return;
    setHintN((h) => h + 1);
    if (step.type === "mcq") {
      const candidates = step.options
        .map((_, i) => i)
        .filter((i) => i !== step.answer && !elim.includes(i) && i !== sel);
      if (candidates.length) {
        const kill = candidates[Math.floor(Math.random() * candidates.length)];
        setElim((e) => [...e, kill]);
        if (sel === kill) setSel(null);
      }
    } else if (step.type === "code") {
      setRevealN((r) => r + 1);
    } else if (step.type === "order") {
      const next = step.items[orderSeq.length];
      setOrderSeq((s) => [...s, next]);
      setOrderPool((p) => {
        const i = p.indexOf(next);
        return i >= 0 ? p.filter((_, j) => j !== i) : p;
      });
    } else if (step.type === "output") {
      const e = String(step.expect).trim();
      setHintText(`The output starts with “${e[0] || ""}” and is ${e.length} character${e.length === 1 ? "" : "s"} long.`);
    } else if (step.type === "numeric") {
      const a = Number(step.answer);
      if (a === 0) setHintText("The answer is between -1 and 1.");
      else {
        const lo = a > 0 ? a * 0.5 : a * 1.5;
        const hi = a > 0 ? a * 1.5 : a * 0.5;
        setHintText(`The answer is between ${fmt(lo)} and ${fmt(hi)}.`);
      }
    }
  };

  const askTutor = async () => {
    if (tutorBusy) return;
    setTutorBusy(true);
    setTutorNote("");
    try {
      const given =
        step.type === "mcq" ? `They chose option ${sel}: "${step.options[sel]}". The correct option is ${step.answer}: "${step.options[step.answer]}".`
        : step.type === "numeric" ? `They answered ${num}. The correct answer is ${step.answer}.`
        : step.type === "output" ? `They answered "${num}". The correct output is "${step.expect}".`
        : step.type === "order" ? `Their order: ${orderSeq.join(" → ")}. Correct order: ${step.items.join(" → ")}.`
        : `Their code:\n${codeText}\nA working solution:\n${step.solution}`;
      const r = await askAI(
        `A learner just got this exercise wrong. In two short, concrete sentences, name the likely misconception and give them the mental model to fix it. Do not restate the question. No cheerleading.
Exercise: ${JSON.stringify({ type: step.type, prompt: step.prompt || step.heading, code: step.code })}
${given}
Respond with ONLY valid JSON: {"note":"..."}`,
        { maxTokens: 300 }
      );
      setTutorNote(String(r.note || "").trim() || "No note returned.");
    } catch (e) {
      setTutorNote(e.message === "NO_KEY" ? "Add an API key in Studio to unlock the tutor." : "Tutor unavailable: " + e.message);
    }
    setTutorBusy(false);
  };

  const advance = () => {
    if (!isGraded) setMark(idx, "read");
    if (idx + 1 >= lesson.steps.length) {
      const td = dayStr(0);
      let streak = learner.streak || 0;
      if (learner.lastDay === td) {}
      else if (learner.lastDay === dayStr(-1)) streak += 1;
      else streak = 1;
      const progress = { ...(learner.courseProgress || {}) };
      if (lessonSource && lessonSource.courseId !== undefined) {
        progress[lessonSource.courseId + ":" + lessonSource.u + ":" + lessonSource.l] = sRight + "/" + sTotal;
      }
      // spaced repetition + skill model updates
      if (lessonSource && lessonSource.review) {
        const nextDeck = deep(deckRef.current);
        const nextSkills = deep(skillsRef.current);
        lessonSource.review.forEach((id, i) => {
          if (!id) return; // re-teach step, not a card
          const c = nextDeck.find((x) => x.id === id);
          if (!c) return;
          const ok = marks[i] === "right";
          const usedHints = (hintMarks[i] || 0) > 0;
          const ease = typeof c.ease === "number" ? c.ease : 2.5;
          bumpSkill(nextSkills, c.topic, ok ? 1 : 0, 0.25);
          c.seen = (c.seen || 0) + 1;
          if (!ok) {
            // again: back to the start, card gets harder to grow
            c.interval = 1;
            c.lapses += 1;
            c.ease = Math.max(1.3, ease - 0.2);
            c.due = dayStr(1);
          } else if (usedHints) {
            // hard: right but assisted, small growth only
            c.interval = Math.max(2, Math.ceil(c.interval * 1.2));
            c.ease = Math.max(1.3, ease - 0.05);
            c.due = dayStr(c.interval);
          } else {
            // good: full ease growth, ease creeps up
            c.ease = Math.min(2.8, ease + 0.05);
            c.interval = Math.ceil(c.interval * ease);
            c.due = dayStr(c.interval);
          }
        });
        persistDeck(nextDeck.filter((c) => c.interval <= 30));
        persistSkills(nextSkills);
      } else if (sTotal > 0 && lessonTopic) {
        const nextSkills = deep(skillsRef.current);
        bumpSkill(nextSkills, lessonTopic, sRight / sTotal, 0.35);
        persistSkills(nextSkills);
      }
      const prevDay = learner.dayXp && learner.dayXp.d === td ? learner.dayXp.xp : 0;
      feedback("done");
      persistLearner({
        xp: (learner.xp || 0) + sXp,
        streak,
        lastDay: td,
        history: [{ t: lesson.title, d: td, s: sRight + "/" + sTotal }, ...(learner.history || [])].slice(0, 10),
        courseProgress: progress,
        dayXp: { d: td, xp: prevDay + sXp },
        lastLesson: lessonSource && lessonSource.courseId !== undefined
          ? { courseId: lessonSource.courseId, u: lessonSource.u, l: lessonSource.l, when: td }
          : learner.lastLesson || null,
      });
      setScreen("done");
      return;
    }
    setIdx((i) => i + 1);
    setSel(null);
    setNum("");
    setChecked(false);
    setCorrect(false);
  };

  const exploreVal = () => {
    try {
      const r = math.evaluate(step.expr, { [step.variable]: Number(sliderVal) });
      return typeof r === "number" && isFinite(r) ? r : null;
    } catch (e) { return null; }
  };

  const lessonProgressOf = (course) => {
    let ready = 0, done = 0, total = 0;
    course.units.forEach((u, ui) =>
      u.lessons.forEach((l, li) => {
        total += 1;
        if (l.status === "ready") ready += 1;
        if ((learner.courseProgress || {})[course.id + ":" + ui + ":" + li]) done += 1;
      })
    );
    return { ready, done, total };
  };

  /* Resume: next ready lesson in any library course (custom ones included). */
  const nextReadyInCourse = (course, preferred) => {
    const prog = learner.courseProgress || {};
    const all = [];
    course.units.forEach((u, ui) =>
      u.lessons.forEach((ls, li) => { if (ls.status === "ready") all.push({ u: ui, l: li, key: course.id + ":" + ui + ":" + li }); })
    );
    if (!all.length) return null;
    const pref = all.find((x) => x.u === preferred.u && x.l === preferred.l);
    if (pref && !prog[pref.key]) return pref;
    const fresh = all.find((x) => !prog[x.key]);
    if (fresh) return fresh;
    const ratio = (v) => { const m = /^(\d+)\/(\d+)$/.exec(v || ""); return m && Number(m[2]) ? Number(m[1]) / Number(m[2]) : 1; };
    return all.reduce((w, x) => (ratio(prog[x.key]) < ratio(prog[w.key]) ? x : w), all[0]);
  };
  const resume = (() => {
    const ll = learner.lastLesson;
    if (!ll) return null;
    const course = library.courses.find((c) => c.id === ll.courseId);
    if (!course) return null;
    const pick = nextReadyInCourse(course, ll);
    if (!pick) return null;
    const ls = course.units[pick.u].lessons[pick.l];
    const prog = lessonProgressOf(course);
    return { course, pick, ls, allDone: prog.done >= prog.total };
  })();
  const resumeStart = () => {
    if (!resume) return;
    setActiveCourseId(resume.course.id);
    launchLesson(
      { title: resume.ls.title, steps: deep(resume.ls.steps) },
      { courseId: resume.course.id, u: resume.pick.u, l: resume.pick.l },
      resume.course.subject
    );
  };

  const activeCourse = activeCourseId ? library.courses.find((c) => c.id === activeCourseId) : null;
  const showTabs = screen === "home";
  const todayXp = learner.dayXp && learner.dayXp.d === today ? learner.dayXp.xp : 0;
  const topSkills = Object.entries(skills)
    .sort((a, b) => b[1].n - a[1].n)
    .slice(0, 5);

  return (
    <div className="page">
      <div className="margin-rule" />
      <div className="inner">
        {showTabs && (
          <div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", paddingTop: 24 }}>
              <span className="mono" style={{ fontSize: 13, fontWeight: 600, letterSpacing: ".2em" }}>PREXIS <span style={{ color: "var(--pencil)", letterSpacing: ".12em", fontWeight: 400 }}>· {profiles.profiles.length > 1 ? ((profiles.profiles.find((p) => p.id === profiles.activeId) || {}).name || "").toUpperCase().slice(0, 14) : "ADAPTIVE"}</span></span>
              <div style={{ display: "flex", gap: 8 }}>
                <span className="pill">STREAK {learner.streak || 0}</span>
                <span className="pill" style={todayXp >= prefs.goal ? { background: "var(--hi)", color: "var(--hi-ink)" } : {}}>TODAY {todayXp}/{prefs.goal}</span>
              </div>
            </div>
            <div style={{ display: "flex", gap: 18, marginTop: 18, borderBottom: "1.5px solid var(--box)" }}>
              {["learn", "studio", "style"].map((t) => (
                <button
                  key={t}
                  onClick={() => { setTab(t); setScreen("home"); }}
                  className="mono"
                  style={{
                    letterSpacing: ".14em", background: "none", border: "none", padding: "6px 2px 10px",
                    color: tab === t ? "var(--ink)" : "var(--pencil)",
                    borderBottom: tab === t ? "3px solid var(--ink)" : "3px solid transparent",
                    marginBottom: -1.5, fontWeight: tab === t ? 600 : 400, fontSize: 12,
                  }}
                >
                  {t.toUpperCase()}
                </button>
              ))}
            </div>
          </div>
        )}

        {screen === "onboard" && (
          <div style={{ paddingTop: 40 }}>
            <p className="kicker">PREXIS · SETUP {obStep + 1}/3</p>
            {obStep === 0 && (
              <div>
                <h1 className="display" style={{ fontWeight: 700, fontSize: 32, lineHeight: 1.1, margin: "14px 0 0" }}>Make it <span className="hi">yours.</span></h1>
                <p style={{ color: "var(--pencil)", fontSize: 14.5, lineHeight: 1.55, marginTop: 12 }}>
                  Pick the look you want to learn in. It applies instantly, and you can change it any time from the Style tab.
                </p>
                <SkinPicker current={prefs.skin || document.documentElement.getAttribute("data-skin")} onPick={(id) => persistPrefs({ ...prefs, skin: id })} />
                <button className="primary" style={{ marginTop: 24 }} onClick={() => setObStep(1)}>Next</button>
              </div>
            )}
            {obStep === 1 && (
              <div>
                <h1 className="display" style={{ fontWeight: 700, fontSize: 32, lineHeight: 1.1, margin: "14px 0 0" }}>How much have you coded?</h1>
                <p style={{ color: "var(--pencil)", fontSize: 14.5, lineHeight: 1.55, marginTop: 12 }}>
                  This sets your starting difficulty. Prexis re-tunes it automatically as you answer. Every lesson watches what you get right.
                </p>
                <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 18 }}>
                  {[["Never, or barely", "Beginner"], ["Some (I can read code)", "Intermediate"], ["A lot (challenge me)", "Advanced"]].map(([label, lv]) => (
                    <button key={lv} className="opt" style={level === lv ? { borderColor: "var(--ink)", background: "var(--sel)" } : {}}
                      onClick={() => { setLevel(lv); setSLevel(lv); }}>
                      {label} <span className="mono" style={{ fontSize: 10, color: "var(--pencil)", marginLeft: 6 }}>{lv.toUpperCase()}</span>
                    </button>

                <button className="primary" style={{ marginTop: 24 }} onClick={() => setObStep(2)}>Next</button>

                </div>
                <button className="primary" style={{ marginTop: 24 }} onClick={() => { persistPrefs({ ...prefs, onboarded: true }); setScreen("home"); }}>Start learning</button>
              </div>

            <button className="mono" style={{ background: "none", border: "none", color: "var(--pencil)", fontSize: 11, marginTop: 16, padding: 0, letterSpacing: ".1em" }}

                    )}
                  </div>
                  <button className="primary" style={{ width: "auto", padding: "10px 14px", fontSize: 14 }} disabled={(learner.xp || 0) < 50}

                  <button className="primary" style={{ width: "auto", padding: "10px 14px", fontSize: 14 }} onClick={startReview}>Review</button>
                </div>

                    </p>
                  </div>
                  <button className="primary" style={{ width: "auto", padding: "10px 14px", fontSize: 14 }} onClick={resumeStart}>Continue</button>
                </div>
              </div>

            <div style={{ marginTop: 22 }}>
              <p className="kicker">QUICK LESSON</p>
              <input
                className="field"
                value={topic}
                onChange={(e) => setTopic(e.target.value)}
