<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Prexis</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.10/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@13.2.0/lib/browser/math.js"></script>
<script src="content.js"></script>
<script src="content_extra.js"></script>
<style>
  :root {
    --paper: #F7F3EA; --paper-2: #FFFDF8; --rule: #E4DCC8;
    --ink: #1A1914; --pencil: #8A8373; --margin: #C43C32; --pen: #1F6B45;
    --hi: #FFE24A; --hi-ink: #1A1914; --box: #D4CDBB;
    --good: #E7F3EB; --bad: #F8E8E6; --sel: #FFF6C8; --shadow: #D4CDBB;
    --bg-image:
      radial-gradient(ellipse at 18% -10%, rgba(255,226,74,.18), transparent 42%),
      repeating-linear-gradient(transparent, transparent 27px, var(--rule) 27px, var(--rule) 28px);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "Archivo", system-ui, sans-serif;
    --serif: "Newsreader", Georgia, serif;
    --page-w: 460px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-skin]) {
      --paper: #22332E; --paper-2: #2B403A; --rule: #2E443D;
      --ink: #F1EEE2; --pencil: #9CB1A5; --margin: #F2A196; --pen: #A9DAB9;
      --hi: #F5D76E; --hi-ink: #22332E; --box: #415C52;
      --good: #2E4A3E; --bad: #4A3230; --sel: #3D5347; --shadow: rgba(0,0,0,.35);
      --bg-image: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.05), transparent 55%);
    }
  }
  :root[data-skin="notebook"] {
    --paper: #F7F3EA; --paper-2: #FFFDF8; --rule: #E4DCC8;
    --ink: #1A1914; --pencil: #8A8373; --margin: #C43C32; --pen: #1F6B45;
    --hi: #FFE24A; --hi-ink: #1A1914; --box: #D4CDBB;
    --good: #E7F3EB; --bad: #F8E8E6; --sel: #FFF6C8; --shadow: #D4CDBB;
    --bg-image:
      radial-gradient(ellipse at 18% -10%, rgba(255,226,74,.18), transparent 42%),
      repeating-linear-gradient(transparent, transparent 27px, var(--rule) 27px, var(--rule) 28px);
  }
  :root[data-skin="chalk"] {
    --paper: #22332E; --paper-2: #2B403A; --rule: #2E443D;
    --ink: #F1EEE2; --pencil: #9CB1A5; --margin: #F2A196; --pen: #A9DAB9;
    --hi: #F5D76E; --hi-ink: #22332E; --box: #415C52;
    --good: #2E4A3E; --bad: #4A3230; --sel: #3D5347; --shadow: rgba(0,0,0,.35);
    --bg-image: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.05), transparent 55%);
  }
  :root[data-skin="terminal"] {
    --paper: #0D1117; --paper-2: #161C24; --rule: #1B2430;
    --ink: #E2E8E2; --pencil: #7E8D80; --margin: #FF7B72; --pen: #3FB950;
    --hi: #2EA043; --hi-ink: #06090D; --box: #2A3440;
    --good: #12261A; --bad: #2D1517; --sel: #16301F; --shadow: rgba(0,0,0,.55);
    --bg-image: repeating-linear-gradient(transparent, transparent 3px, rgba(255,255,255,.012) 3px, rgba(255,255,255,.012) 4px);
  }
  :root[data-skin="gallery"] {
    --paper: #FFFFFF; --paper-2: #FFFFFF; --rule: #F0F0EE;
    --ink: #17181C; --pencil: #74757D; --margin: #DC2626; --pen: #0B7A55;
    --hi: #4F46E5; --hi-ink: #FFFFFF; --box: #E2E2E6;
    --good: #ECFDF5; --bad: #FEF2F2; --sel: #EEF2FF; --shadow: #E7E7EA;
    --bg-image: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  body { background-image: var(--bg-image); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  input, textarea { font: inherit; color: inherit; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  input[type=range] { accent-color: var(--ink); width: 100%; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @keyframes blink { 0%,100% { opacity:.18 } 50% { opacity:1 } }
  @keyframes rise { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform:none } }
  .page { max-width: var(--page-w); margin: 0 auto; min-height: 100vh; position: relative; }
  :root[data-wide="on"] { --page-w: 640px; }
  :root[data-size="s"] .page { zoom: 0.92; }
  :root[data-size="l"] .page { zoom: 1.1; }
  .margin-rule { position: absolute; top: 0; bottom: 0; left: 34px; width: 2px; background: rgba(196,60,50,.48); pointer-events: none; }
  :root[data-skin="chalk"] .margin-rule { background: rgba(242,161,150,.35); }
  :root[data-skin="terminal"] .margin-rule, :root[data-skin="gallery"] .margin-rule { display: none; }
  .inner { position: relative; padding: 0 20px 88px 50px; animation: rise .35s ease; }
  :root[data-skin="terminal"] .inner, :root[data-skin="gallery"] .inner { padding-left: 20px; }
  @media (max-width: 400px) {
    .margin-rule { left: 20px; }
    .inner { padding-left: 34px; padding-right: 16px; }
    :root[data-skin="terminal"] .inner, :root[data-skin="gallery"] .inner { padding-left: 16px; }
  }
  .display { font-family: var(--serif); letter-spacing: -0.02em; }
  :root[data-heads="sans"] .display { font-family: var(--sans); letter-spacing: -0.01em; }
  .mono { font-family: var(--mono); letter-spacing: .02em; }
  .kicker { font-family: var(--mono); font-size: 11px; color: var(--pencil); letter-spacing: .16em; }
  .pill { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; border: 1.5px solid var(--ink); border-radius: 4px; padding: 4px 8px; background: var(--paper-2); }
  .hi { background: var(--hi); color: var(--hi-ink); padding: 0 .18em; box-decoration-break: clone; }
  .primary { font-family: var(--sans); font-weight: 800; font-size: 16px; width: 100%; padding: 13px 16px; background: var(--hi); color: var(--hi-ink); border: 1.5px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink); }
  :root[data-skin="chalk"] .primary, :root[data-skin="terminal"] .primary { box-shadow: 3px 3px 0 rgba(0,0,0,.5); border-color: var(--hi); }
  .primary:active { transform: translate(1px,1px); box-shadow: 2px 2px 0 var(--ink); }
  .primary[disabled] { opacity: .4; box-shadow: none; transform: none; }
  .ghost { font-family: var(--mono); font-size: 11px; padding: 5px 9px; border-radius: 4px; border: 1.5px solid var(--box); background: var(--paper-2); }
  .ghost.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .card { background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--shadow); text-align: left; }
  .code { font-family: var(--mono); font-size: 13px; line-height: 1.55; background: var(--paper-2); border: 1.5px solid var(--box); border-radius: 6px; padding: 12px 14px; overflow-x: auto; white-space: pre; margin: 0; color: var(--ink); }
  .field { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--ink); font-size: 18px; font-weight: 600; padding: 8px 0; }
  .opt, .chip { width: 100%; text-align: left; background: var(--paper-2); border: 1.5px solid var(--box); border-radius: 6px; padding: 12px 14px; font-size: 15px; line-height: 1.4; }
  .opt.elim { opacity: .35; text-decoration: line-through; }
  .chip { width: auto; font-size: 14px; padding: 8px 12px; }
  .chip.codey { font-family: var(--mono); font-size: 13px; }
  .mark { width: 24px; height: 24px; border-radius: 4px; border: 1.5px solid var(--box); background: var(--paper-2); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 13px; }
  .bar { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--pen); border-radius: 3px; }
  .hintbox { margin-top: 12px; padding: 10px 12px; border-radius: 6px; border: 1.5px dashed var(--pencil); background: var(--paper-2); font-size: 14px; line-height: 1.5; }
  .swatch { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 12px; border-radius: 6px; border: 1.5px solid var(--box); background: var(--paper-2); flex: 1 1 40%; min-width: 130px; text-align: left; }
  .swatch.on { border-color: var(--ink); box-shadow: 3px 3px 0 var(--shadow); }
  .dot { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,.25); display: inline-block; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
